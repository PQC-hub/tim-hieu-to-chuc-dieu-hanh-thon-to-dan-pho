 if(d.completions){o.push('Điểm trung bình '+fmt(d.avg*10)+'/100; '+d.pass+'% lượt làm bài đạt từ 50 điểm trở lên.');}
 if(bestK&&bp>=70)o.push('Phần nội dung nắm tốt nhất: '+GROUPS[bestK].t+' ('+bp+'% câu đúng).');
 if(weak.length){weak.sort(function(x,y){return x.p-y.p});o.push('Phần cần tăng cường tuyên truyền, ôn tập (thấp nhất trước): '+weak.map(function(w){return w.t}).join('; ')+'.')}
 return o;
}
function viewStats(){
 var h='<div class="bar"><div class="wrap"><button class="tbtn" data-act="home" aria-label="Về trang đầu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg></button><div class="mid"><b>Thống kê chung</b></div>'+sbtn()+tbtn()+'<button class="btn sm" data-act="stats">Làm mới</button></div></div><div class="wrap" style="padding-top:18px;padding-bottom:40px">';
 if(S.loading)return h+'<div class="card">Đang tải số liệu…</div></div>';
 if(S.err)return h+'<div class="note">Chưa tải được số liệu thống kê. Kiểm tra kết nối mạng rồi bấm “Làm mới”.<br><small>Chi tiết: '+esc(S.why||'')+'</small></div></div>';
 var d=S.st;
 h+='<div class="bigstat"><div class="stat"><b>'+d.visitors+'</b><small>người đã truy cập</small></div><div class="stat"><b>'+d.participants+'</b><small>người đã làm bài</small></div><div class="stat"><b>'+d.completions+'</b><small>lượt làm đủ 101 câu</small></div><div class="stat"><b>'+(d.completions?fmt(d.avg*10):'–')+'</b><small>điểm trung bình</small></div><div class="stat"><b>'+(d.completions?d.pass+'%':'–')+'</b><small>lượt đạt (từ 50 điểm)</small></div><div class="stat"><b>'+(d.completions?mmss(d.avgSecs):'–')+'</b><small>thời gian làm TB</small></div></div>';
 if(!d.completions)return h+'<div class="note">Chưa có ai làm đủ bài. Khi có kết quả, phần phân tích sẽ hiện ở đây.</div></div>';
 var cm=statsComment(d);if(cm.length)h+='<div class="comments">'+cm.map(function(c){return '<p>'+esc(c)+'</p>'}).join('')+'</div>';
 h+='<div class="card"><div class="sec-t">Phân bố xếp loại</div><div class="meters">';
 GRADES.forEach(function(g){var c=d.grades[g.name]||0,p=pct(c,d.completions);h+='<div class="l-mid"><div class="meter-top"><b>'+esc(g.name)+'</b><span>'+c+' lượt · '+p+'%</span></div><div class="mbar"><i data-w="'+p+'"></i></div></div>'});
 h+='</div><div class="sec-t" style="margin-top:20px">Tỷ lệ trả lời đúng theo 4 phần nội dung</div>'+gbars(d.th,false)+'</div>';
 var qs=(d.q||[]).filter(function(x){return x.n>=1}).map(function(x){return {i:x.i,p:pct(x.c,x.n),n:x.n}}).sort(function(a,b){return a.p-b.p||b.n-a.n}).slice(0,8);
 if(qs.length){h+='<div class="sec"><div class="sec-t">Những câu nhiều người trả lời sai nhất</div><ul class="hq">';qs.forEach(function(x){var b=BANK[x.i];if(!b)return;h+='<li><b>'+x.p+'% đúng</b> · '+esc(b.r)+' — '+esc(b.q)+'<br><span style="color:var(--muted)">'+esc(b.e)+'</span></li>'});h+='</ul></div>'}
 h+='<p class="best">Số liệu không ghi tên (chỉ dùng mã ngẫu nhiên), cập nhật lúc '+esc(new Date(d.updated).toLocaleString('vi-VN'))+'.</p></div>';
 return h;
}
function showShare(tx){
 var old=document.getElementById('shov');if(old)old.remove();
 var d=document.createElement('div');d.id='shov';
 d.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px';
 var fb='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(SHARE_URL);
 d.innerHTML='<div style="background:var(--card);color:var(--ink);border-radius:20px;padding:16px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.4)"><div style="font-weight:800;font-size:18px;margin-bottom:8px">Gửi cho bạn bè</div><textarea id="shtx" readonly rows="5" style="width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:10px;font:inherit;font-size:15px"></textarea><div id="shmsg" style="min-height:20px;font-size:14px;color:var(--red);margin:6px 0"></div><button class="btn pri wide" id="shcp" style="margin:0 0 8px">📋 Sao chép nội dung (để dán vào Zalo)</button>'+(navigator.share?'<button class="btn wide" id="shnat" style="margin:0 0 8px">📤 Mở bảng chia sẻ của điện thoại</button>':'')+'<a class="btn wide" href="'+fb+'" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin:0 0 8px;box-sizing:border-box">Chia sẻ lên Facebook</a><button class="btn wide" id="shx" style="margin:0">Đóng</button></div>';
 document.body.appendChild(d);
 var ta=document.getElementById('shtx'),msg=document.getElementById('shmsg');ta.value=tx;
 function ok(){msg.textContent='✔ Đã sao chép. Mở Zalo, bấm giữ ô nhập tin và chọn Dán.'}
 function manual(){ta.focus();ta.select();ta.setSelectionRange(0,tx.length);try{if(document.execCommand('copy')){ok();return}}catch(e){}msg.textContent='Nội dung đã được chọn sẵn: bấm giữ rồi chọn Sao chép.'}
 document.getElementById('shcp').onclick=function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(ok,manual)}else manual()};
 var nb=document.getElementById('shnat');if(nb)nb.onclick=function(){navigator.share({text:tx}).catch(function(){})};
 document.getElementById('shx').onclick=function(){d.remove()};
 d.onclick=function(e){if(e.target===d)d.remove()};
}
function render_(){
 var h=S===null||S.view==='start'?viewStart():S.view==='quiz'?viewQuiz():S.view==='stats'?viewStats():viewResult();
 if(pend&&S===null)h+=pendOv();h+=navHtml();app.innerHTML=h;
 if(S&&S.view==='stats'){setTimeout(function(){var ms=document.querySelectorAll('.mbar i,.gtr i');for(var i=0;i<ms.length;i++)ms[i].style.width=ms[i].getAttribute('data-w')+'%'},30)}
 if(S&&S.view==='result'){
  var r=S.res,fg=document.getElementById('rfg'),rn=document.getElementById('rn');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){if(fg)fg.style.strokeDashoffset=String(326.7*(1-r.score/10));var ms=document.querySelectorAll('.mbar i,.gtr i');for(var i=0;i<ms.length;i++)ms[i].style.width=ms[i].getAttribute('data-w')+'%'},30);
  if(reduce){rn.textContent=String(Math.round(r.score*10))}else{var t0=performance.now();(function step(t){var p=Math.min(1,(t-t0)/1000);rn.textContent=String(Math.round(r.score*10*p));if(p<1)requestAnimationFrame(step);else rn.textContent=String(Math.round(r.score*10))})(t0)}
 }
}
function finish(){
 S.qs.forEach(function(q,k){if(S.ans[k]!==undefined){markSeen(q.i);setWrong(q.i,!q.opts[S.ans[k]].ok)}});clearInterval(timer);S.el=Math.floor((Date.now()-S.t0)/1000);S.res=compute();S.view='result';S.confirm=false;clearProg(S.mode);
 if(S.qs.length===BANK.length){var g=gradeOf(S.res.score);if(!best||S.res.score>best.s){best={s:S.res.score,g:g.name};ls('qdthon_best',JSON.stringify(best))}}
 if(S.qs.length===BANK.length&&ENDPOINT){var th={},ty={};['th','ty'].forEach(function(w){var src=S.res[w],dst=w==='th'?th:ty;Object.keys(src).forEach(function(k){dst[k]=[src[k].c,src[k].n]})});
  send({t:'result',mode:S.mode,score:S.res.score,c:S.res.c,n:S.res.n,secs:S.el,q:S.qs.map(function(q,k){var a=S.ans[k];return [q.i,a===undefined?-1:(q.opts[a].ok?1:0)]}),th:th,ty:ty});S.sent=true}
 sfx(S.res.score>=5?'win':'end');render();window.scrollTo(0,0);
}
function pick(j){
 var k=S.cur;if(S.mode==='learn'&&S.ans[k]!==undefined)return;
 if(S.mode==='exam'&&S.ans[k]===j){delete S.ans[k];sfx('tick')}else{S.ans[k]=j;if(S.mode==='learn'){markSeen(S.qs[k].i);setWrong(S.qs[k].i,!S.qs[k].opts[j].ok)}sfx(S.mode==='learn'?(S.qs[k].opts[j].ok?'ok':'bad'):'tick')}
 render();
}
function goto(i){if(i<0||i>=S.qs.length)return;S.cur=i;render();window.scrollTo(0,0)}
app.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act');
 if(a==='snd')return toggleSnd();
 if(a==='theme')return toggleTheme();
 if(a==='mode'){mode=el.getAttribute('data-m');askRestart=false;return render()}
 if(a==='rs_no'){askRestart=false;return render()}
 if(a==='rs_ok'){askRestart=false;clearProg(mode);return newSession(mode,BANK.map(function(_,i){return i}))}
 if(a==='cont'){var rd2=readProg('learn');if(rd2)return newSession('learn',rd2.idx,rd2);var un=allIdx().filter(function(i){return !SEEN[i]});return startNew('learn',un.length?un:allIdx())}
 if(a==='rand20'){var al=shuffle(allIdx());return startNew('learn',al.slice(0,20))}
 if(a==='mod')return startNew('learn',modIdx(MODS[+el.getAttribute('data-n')]));
 if(a==='pend_no'){pend=null;return render()}
 if(a==='pend_ok'){var pp=pend;pend=null;clearProg(pp.mode);return newSession(pp.mode,pp.idx)}
 if(a==='tab'){if(S&&S.view==='result'&&!window.confirm('Rời khỏi trang kết quả? Kết quả chi tiết bài này sẽ không xem lại được.'))return;tab=el.getAttribute('data-t');if(S&&S.view==='quiz')flush();clearInterval(timer);S=null;render();return window.scrollTo(0,0)}
 if(a==='review'){var wl=Object.keys(WR).map(Number).sort(function(x,y){return x-y});return wl.length?startNew('learn',wl):render()}
 if(a==='resetprog'){if(window.confirm('Xóa tiến độ học, câu cần ôn và bài đang làm dở trên máy này?')){SEEN={};WR={};['qdthon_seen','qdthon_wrong'].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});clearProg('learn');clearProg('exam')}return render()}
 if(a==='stats')return loadStats();
 if(a==='resume'){var rd=readProg(mode);if(!rd){S=null;return render()}return newSession(rd.mode,rd.idx,rd)}
 if(a==='start'&&readProg(mode)){askRestart=true;return render()}
 if(a==='start')return newSession(mode,BANK.map(function(_,i){return i}));
 if(a==='home'){tab='home';if(S&&S.view==='quiz')saveProg();clearInterval(timer);S=null;render();return window.scrollTo(0,0)}
 if(a==='shareapp'||(S&&a==='share')){var tx;
  if(a==='share'){var r2=S.res;tx='Mình vừa làm bài "Tìm hiểu hoạt động thôn, tổ dân phố dành cho cán bộ cơ sở": đúng '+r2.c+'/'+r2.n+' câu, '+Math.round(r2.score*10)+'/100 điểm. Mời bà con cùng làm: '+SHARE_URL}
  else tx='Mời bà con và anh chị em cán bộ cơ sở cùng làm bài "Tìm hiểu hoạt động thôn, tổ dân phố dành cho cán bộ cơ sở" (101 câu, có giải thích và căn cứ pháp lý): '+SHARE_URL;
  showShare(tx);
  return}
 if(!S)return;
 if(a==='opt')return pick(+el.getAttribute('data-j'));
 if(a==='go')return goto(+el.getAttribute('data-i'));
 if(a==='prev')return goto(S.cur-1);
 if(a==='next'){if(S.cur===S.qs.length-1){S.confirm=true;return render()}return goto(S.cur+1)}
 if(a==='flag'){S.flag[S.cur]=!S.flag[S.cur];return render()}
 if(a==='submit'){S.confirm=true;return render()}
 if(a==='cancel'){S.confirm=false;return render()}
 if(a==='confirm')return finish();
 if(a==='filter'){S.filter=el.getAttribute('data-f');return render()}
 if(a==='again')return newSession(S.mode,BANK.map(function(_,i){return i}));
 if(a==='redo'){var idx=[];S.qs.forEach(function(q,k){var x=S.ans[k];if(!(x!==undefined&&q.opts[x].ok))idx.push(q.i)});return newSession('learn',idx)}
});
document.addEventListener('keydown',function(e){
 if(!S||S.view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
 var k=e.key.toLowerCase();
 if(k.length===1){var j='abcd'.indexOf(k);if(j<0)j='1234'.indexOf(k);if(j>=0&&j<S.qs[S.cur].opts.length&&!S.confirm){pick(j)}return}
 if(S.confirm)return;
 if(k==='arrowright')goto(S.cur+1);else if(k==='arrowleft')goto(S.cur-1);else if(k==='enter'&&S.mode==='learn'&&S.ans[S.cur]!==undefined&&S.cur<S.qs.length-1)goto(S.cur+1);
});
function flush(){if(S&&S.view==='quiz'){S.el=Math.floor((Date.now()-S.t0)/1000);saveProg()}}
document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});window.addEventListener('pagehide',flush);
theme();pingVisit();
var bt=document.getElementById('boot');if(bt)bt.parentNode.removeChild(bt);
render();
})();
</script>
