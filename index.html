nh, thay cho họp thôn, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Có giá trị quyết định nếu có trên 50% hộ tham dự mà không cần hỏi ý kiến thêm của người dân","Được tính trực tiếp là phiếu tán thành của từng hộ"],"e":"Họp tổ liên gia giúp tổng hợp ý kiến, giảm quá tải. Nhưng đó chỉ là bước tham khảo. Việc để Nhân dân bàn và quyết định phải theo Điều 18 Luật, kể cả trường hợp họp theo cụm dân cư (Trưởng thôn báo cáo UBND cấp xã và thống nhất với Ban Công tác Mặt trận).\nVì sao các phương án còn lại chưa đúng: họp tổ liên gia không thay thế họp thôn, và ý kiến sơ bộ không được cộng thành phiếu tán thành.","t":"Họp tổ liên gia: tham khảo. Quyết định: phải đúng Điều 18, 21."},{"s":"E","y":"NH","r":"Cẩm nang · mục 6.2 (kinh nghiệm)","q":"Báo cáo tổng kết dài trong một buổi sinh hoạt cộng đồng đông người, cách xử lý nào hiệu quả hơn cả?","o":["Niêm yết bản đầy đủ, trình bày 2–3 kết quả nổi bật, rồi giao lưu, vinh danh","Đọc nguyên văn từ đầu đến cuối để bảo đảm đúng quy trình và đầy đủ số liệu báo cáo","Bỏ qua phần báo cáo tổng kết, không cần công khai kết quả cho người dân trong buổi họp","Chỉ gửi báo cáo cho cán bộ thôn, không cần phổ biến thêm nội dung đó cho người dân"],"e":"Cẩm nang khuyên không đọc nguyên văn báo cáo dài. Người điều hành giữ tờ tóm tắt các con số cốt lõi, kể lại gần gũi; báo cáo đầy đủ niêm yết để ai cần thì xem. Đây là kinh nghiệm tổ chức, không phải quy định pháp luật.\nCông khai vẫn cần thiết, nhưng có thể thực hiện bằng niêm yết, truyền thanh, nhóm Zalo thay vì đọc hết trong cuộc họp.\nVì sao các phương án còn lại chưa đúng: đọc dài làm người dự mất tập trung; bỏ qua hoặc không phổ biến thì trái nguyên tắc dân biết.","t":"Báo cáo dài: niêm yết đủ, trình bày gọn 2–3 kết quả nổi bật."},{"s":"E","y":"NH","r":"Cẩm nang · mục 6.5 (kinh nghiệm)","q":"Hiện tượng \"tâm lý a dua theo đám đông\" trong cuộc họp đông người nghĩa là gì?","o":["Dễ đồng tình hoặc phản đối theo cảm xúc chung của nhóm đông, ít kiểm chứng thông tin","Mọi người đều bình tĩnh, cân nhắc kỹ lưỡng và biểu quyết rất chính xác theo số liệu","Người dân chỉ chăm chú nghe các số liệu tài chính khô khan rồi mới đưa ra ý kiến riêng","Người lớn tuổi luôn bị bỏ qua ý kiến vì không theo kịp nhịp điệu của cuộc họp đông người"],"e":"Trong đám đông, cảm xúc lan nhanh và tư duy phản biện cá nhân giảm: người ta dễ \"a dua\" theo ý kiến áp đảo. Vì vậy chỉ vài tiếng la ó có thể kéo cả hội trường đi theo.\nHiểu điều đó, người điều hành chủ động chia nhóm nhỏ, mời người có uy tín nói và chốt đúng lúc.\nVì sao các phương án còn lại chưa đúng: đó là mô tả ngược lại hoặc không liên quan; chính đám đông ưu tiên cảm xúc hơn số liệu.","t":"Đám đông: lan truyền cảm xúc, a dua, nghe tiếng nói áp đảo."},{"s":"E","y":"NH","r":"Cẩm nang · mục 6.6 (kinh nghiệm)","q":"Khi cuộc họp đang căng thẳng vì một vấn đề nhạy cảm, cách xử lý nào đúng tinh thần của Cẩm nang?","o":["Ghi nhận cảm xúc trước, chia nhóm nhỏ thảo luận ngắn, rồi quay lại định hướng giải pháp","Yêu cầu những người phản đối im lặng để cuộc họp tiếp tục đúng chương trình đã định","Dừng họp và tuyên bố đã đủ đồng thuận để kết thúc nội dung gây căng thẳng cho nhanh","Chỉ cho phát biểu những người ủng hộ chủ trương để tránh làm không khí thêm căng thẳng"],"e":"Cẩm nang gợi ý thừa nhận cảm xúc trước, định hướng giải pháp sau; phân nhóm nhỏ khoảng 5 phút để hạ nhiệt; mời người có uy tín phát biểu để cân bằng. Quan trọng: kỹ năng này không nhằm dập tắt ý kiến trái chiều. Mọi ý kiến phản đối là quyền của Nhân dân và phải được ghi vào biên bản.\nVì sao các phương án còn lại chưa đúng: ép im lặng, tuyên bố đồng thuận giả hoặc chỉ cho người ủng hộ nói đều trái quyền làm chủ của Nhân dân.","t":"Hạ nhiệt để đối thoại rõ hơn, không để dập tắt ý kiến trái chiều."},{"s":"E","y":"NH","r":"Cẩm nang · mục 6.6 (kinh nghiệm)","q":"Theo Cẩm nang, thời điểm nào là phù hợp để chốt một vấn đề đang bàn trong cuộc họp?","o":["Ngay khi thấy đa số đã đồng thuận, chốt rõ ràng rồi mới chuyển nội dung","Khi chưa ai phát biểu ý kiến nào, để cuộc họp kết thúc sớm cho mọi người đỡ mệt","Chỉ chốt khi mọi người đã nói hết ý, dù cuộc họp có kéo dài thêm nhiều giờ liền nữa","Chốt ngay trước khi bắt đầu thảo luận, rồi để mọi người góp ý sau cho đúng chương trình"],"e":"Chốt quá sớm khiến người dân chưa được nói; chốt quá muộn thì sự đồng thuận nguội dần. Cách tốt là chốt rõ ràng, dứt khoát ngay khi nhận thấy đa số đã đồng thuận, để nội dung được tập thể thừa nhận.\nLưu ý: chốt về mặt điều hành không thay thế việc biểu quyết theo tỷ lệ của Điều 21.\nVì sao các phương án còn lại chưa đúng: chốt trước khi thảo luận làm mất dân chủ; kéo dài vô hạn làm nguội sự đồng thuận.","t":"Chốt đúng lúc: khi đa số đã đồng thuận. Quyết định vẫn phải đủ tỷ lệ."},{"s":"F","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 2 khoản 2, Điều 3 khoản 3; Cẩm nang Tình huống 1","q":"Một người dân đến nhà Trưởng thôn, lớn tiếng yêu cầu ký xác nhận ngay giấy tờ đất đai, cho rằng Trưởng thôn là \"cán bộ nhà nước cấp thôn\". Trưởng thôn nên làm gì?","o":["Bình tĩnh giải thích thôn là tự quản, hướng dẫn hồ sơ, chỉ đến bộ phận một cửa cấp xã","Ký xác nhận ngay giấy tờ cho người dân để tránh xung đột và tiếng ồn trong xóm và không phải giải thích thêm cho các hộ trong thôn","Từ chối thẳng thừng, nói đó không phải việc của mình và không hướng dẫn gì thêm, miễn là công trình kịp hoàn thành đúng kế hoạch","Yêu cầu người dân làm đơn gửi lên cấp huyện trước đây để được giải quyết thủ tục"],"e":"Thôn là tổ chức tự quản, không phải cấp hành chính, nên Trưởng thôn không có thẩm quyền giải quyết thủ tục hành chính thuộc UBND cấp xã. Ứng xử đúng là giữ bình tĩnh, giải thích, hướng dẫn hồ sơ và chỉ đường đến bộ phận một cửa của cấp xã; có thể phối hợp với tổ hòa giải hoặc đoàn thể thăm hỏi nếu có hiểu lầm.\nVì sao các phương án còn lại chưa đúng: ký xác nhận khi không có thẩm quyền là sai quy định; từ chối cộc lốc làm mất lòng dân; và mô hình hai cấp không còn cấp huyện.","t":"Thủ tục hành chính: hướng dẫn người dân đến bộ phận một cửa cấp xã.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"F","y":"NH","r":"Cẩm nang · Tình huống 2; Luật 10/2022/QH15 · Điều 19, 21","q":"Trưởng thôn họp bàn mức đóng góp làm đường bê tông ngõ xóm. Đến giờ khai mạc chỉ có 35% số hộ dự do bận mùa vụ; một số người đòi cứ biểu quyết luôn. Cách xử lý đúng là gì?","o":["Chưa chốt vội; ghi nhận ý kiến, phát phiếu từng hộ cho đủ hai phần ba tổng số hộ, báo UBND cấp xã","Biểu quyết ngay tại cuộc họp, vì những người có mặt là đại diện cho toàn thể thôn, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Hủy bỏ việc làm đường vì không có đủ số người dự họp theo kế hoạch ban đầu của thôn mà không cần hỏi ý kiến thêm của người dân","Chỉ cần trên 50% số người có mặt tán thành là được thông qua, không cần lấy thêm ý kiến"],"e":"Mức đóng góp xây dựng hạ tầng là nội dung cần từ hai phần ba tổng số đại diện hộ tán thành (Điều 21 khoản 1), nên với 35% số hộ dự họp, chắc chắn không thể đủ. Khi họp không đủ đại diện để đạt tỷ lệ, Điều 19 cho phép phát phiếu lấy ý kiến từng hộ.\nNgưỡng này tính trên tổng số hộ, không phải trên số người có mặt. Báo cáo nhanh UBND cấp xã để được hướng dẫn thêm.\nLưu ý: bản Cẩm nang gốc nêu ngưỡng \"trên 50%\"; theo Điều 21 khoản 1, riêng nội dung đóng góp là hai phần ba.\nVì sao các phương án còn lại chưa đúng: biểu quyết vội dễ bị coi không hợp lệ; hủy là quá mức; tính trên người có mặt là sai cách tính.","t":"Đóng góp: ≥ 2/3 tổng số hộ. Họp thiếu người: phát phiếu từng hộ.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"F","y":"NH","r":"Cẩm nang · Tình huống 3; NĐ 59/2023/NĐ-CP","q":"Thôn hơn 450 hộ họp bàn quy ước, hội trường chật, nhiều người đứng ngoài không nghe rõ, tranh luận vòng vo. Cách nào phù hợp nhất?","o":["Nhắc trật tự, chiếu tờ tóm tắt, chia nhóm theo tổ liên gia tổng hợp ý kiến, rút kinh nghiệm","Giải tán cuộc họp ngay vì không khí quá hỗn loạn, hẹn họp lại vào một dịp khác sau đó, miễn là công trình kịp hoàn thành đúng kế hoạch","Cắt micro những người phát biểu trái ý để cuộc họp tiếp tục suôn sẻ và nhanh chóng hơn","Quyết định luôn nội dung quy ước, không cần biểu quyết, vì cuộc họp đã kéo dài quá lâu và không phải giải thích thêm cho các hộ trong thôn"],"e":"Kết hợp ba việc: đưa cuộc họp về trọng tâm bằng tài liệu đã gửi trước; chia nhóm theo tổ liên gia tổng hợp ý kiến trong khoảng 10 phút để hạ nhiệt; và rút kinh nghiệm lần sau lấy ý kiến cấp tổ trước, họp chung chỉ để công bố tổng hợp và biểu quyết. Chia nhóm chỉ để tổng hợp ý kiến, biểu quyết vẫn phải theo Luật.\nVì sao các phương án còn lại chưa đúng: giải tán hoặc cắt micro người trái ý đều không đúng tinh thần dân chủ; quy ước phải được biểu quyết thông qua.","t":"Họp đông: gửi tài liệu trước, chia nhóm tổng hợp ý kiến, biểu quyết vẫn theo luật.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-so-59-2023-nd-cp-quy-dinh-chi-tiet-mot-so-dieu-cua-luat-thuc-hien-dan-chu-o-co-so-119230820172027752.htm"},{"s":"F","y":"NH","r":"Cẩm nang · Tình huống 4; Luật 10/2022/QH15 · Điều 15, 21","q":"Họp bàn mức đóng góp xây nhà văn hóa, nhóm hộ khó khăn và hộ ở xa phản đối mức đóng cào bằng. Trưởng thôn nên xử lý thế nào?","o":["Ghi nhận ý kiến, đề xuất đóng góp phân bậc, tạm hoãn biểu quyết nếu ý kiến còn chênh lệch","Áp mức đóng góp cào bằng vì đa số hộ có mặt đã ủng hộ phương án ban đầu của Ban thôn mà không cần hỏi ý kiến thêm của người dân","Loại những hộ phản đối ra khỏi danh sách tham dự họp để cuộc họp thuận lợi, nhanh chóng","Trưởng thôn tự quyết mức đóng góp vì cho rằng đó là việc thuộc thẩm quyền điều hành, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Mức đóng góp thuộc nội dung Nhân dân quyết định và cần từ hai phần ba tổng số đại diện hộ, nên mục tiêu là tìm phương án đủ đồng thuận, không phải thắng bằng số đông mỏng. Giải pháp phân bậc, cho phép đóng bằng ngày công và vận động xã hội hóa vừa công bằng vừa dễ được thông qua.\nVì sao các phương án còn lại chưa đúng: áp mức cào bằng khi còn phản đối lớn dễ không đạt tỷ lệ; loại hộ phản đối ra khỏi họp là vi phạm quyền; Trưởng thôn không được tự quyết nội dung thuộc thẩm quyền cộng đồng.","t":"Đóng góp cần đồng thuận cao: ghi nhận, phân bậc, hoãn nếu cần.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"F","y":"NH","r":"Cẩm nang · Tình huống 5 (kinh nghiệm)","q":"Trưởng thôn đọc báo cáo tổng kết 45 phút, người dân nói chuyện riêng, bấm điện thoại. Hướng khắc phục nào là hợp lý?","o":["Rút ngắn báo cáo, niêm yết bản đầy đủ, mời gương điển hình giao lưu, thêm văn nghệ, quà nhỏ","Yêu cầu mọi người tắt điện thoại, giữ trật tự và tiếp tục nghe đọc hết bản báo cáo in sẵn","Kết thúc cuộc họp ngay và bỏ qua phần tổng kết vì người dân không còn muốn nghe nữa và không phải giải thích thêm cho các hộ trong thôn","Chuyển sang nội dung khác, không công khai kết quả vì đã tốn nhiều thời gian của cuộc họp"],"e":"Theo Cẩm nang, nhận diện hạn chế ngay tại chỗ, chủ động rút gọn, tóm tắt 2–3 kết quả nổi bật, niêm yết báo cáo đầy đủ; sau đó chuyển sang giao lưu và vinh danh để kéo lại sự chú ý. Đây là kinh nghiệm điều hành, không phải quy định pháp luật.\nVì sao các phương án còn lại chưa đúng: ép nghe tiếp làm người dân chán thêm; bỏ tổng kết hoặc không công khai thì thiếu minh bạch.","t":"Họp nhàm: rút gọn báo cáo, tăng giao lưu, vinh danh."},{"s":"F","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 1 điểm b","q":"Một hộ hỏi vì sao chưa thấy công bố thu chi quỹ làm đường. Trưởng thôn nên làm gì?","o":["Cảm ơn ý kiến, cung cấp số liệu, niêm yết tại nhà văn hóa, báo cáo công khai ở họp gần nhất","Trả lời rằng việc này đã có người phụ trách lo liệu nên hộ dân không cần phải hỏi thêm, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Hẹn hộ đó đến gặp riêng để xem số liệu và không công bố cho các hộ khác trong thôn biết","Cho rằng người hỏi đang nghi ngờ mình nên không trả lời, tránh làm to chuyện trong xóm, miễn là công trình kịp hoàn thành đúng kế hoạch"],"e":"Người dân có quyền biết các khoản đóng góp của mình đã được thu, chi, quản lý ra sao; việc này phải bảo đảm công khai, minh bạch (Điều 5 khoản 1 điểm b). Câu hỏi của người dân là cơ hội để Trưởng thôn công bố rõ ràng cho cả thôn, không chỉ cho riêng một hộ.\nĐối thoại cởi mở giúp củng cố niềm tin; né tránh dễ làm tin đồn lan rộng.\nVì sao các phương án còn lại chưa đúng: từ chối, hẹn riêng hay coi câu hỏi là nghi ngờ đều không đáp ứng yêu cầu công khai, minh bạch với toàn thể cộng đồng.","t":"Dân hỏi về thu chi: trả lời rõ, công khai cho cả thôn.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"F","y":"NH","r":"Cẩm nang · Tình huống 4; NĐ 185/2026/NĐ-CP · Điều 5 khoản 1 điểm a, g","q":"Một hộ có thành viên là người có công, thuộc diện khó khăn, không đủ tiền đóng góp xây nhà văn hóa. Trưởng thôn nên làm gì?","o":["Đề xuất miễn, giảm hoặc đóng bằng ngày công để cộng đồng bàn, quyết; vận động tương trợ","Tự ý miễn đóng góp cho hộ đó mà không cần thông báo hay đưa ra cộng đồng bàn bạc và không phải giải thích thêm cho các hộ trong thôn","Yêu cầu đóng đủ như các hộ khác, nếu không đóng thì không cho dự các cuộc họp thôn","Công khai trong cuộc họp danh sách và tên các hộ chưa đóng được để mọi người biết mà không cần hỏi ý kiến thêm của người dân"],"e":"Mức đóng góp và việc thu, chi do cộng đồng bàn, quyết định, nên các phương án miễn, giảm hoặc đóng bằng ngày công cũng cần được đưa ra để cộng đồng thông qua, bảo đảm công bằng và minh bạch. Điều 5 khoản 1 điểm g nêu biện pháp khuyến khích tương trợ, giúp đỡ lẫn nhau. Cẩm nang gợi ý phân bậc đóng góp, hộ khó khăn giảm trừ hoặc đóng bằng ngày công.\nCách làm này vừa giữ nghĩa tình với gia đình có công, hộ khó khăn, vừa không phá vỡ nguyên tắc dân chủ.\nVì sao các phương án còn lại chưa đúng: tự ý miễn thiếu minh bạch và dễ gây ý kiến trái chiều; ép đóng đủ hoặc loại khỏi họp là trái quyền tham gia; nêu tên hộ khó khăn làm tổn thương và mất đoàn kết.","t":"Hộ khó khăn, gia đình có công: phương án miễn, giảm do cộng đồng bàn, quyết, giữ phẩm giá cho hộ.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"F","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 6 khoản 2 điểm b; NĐ 59/2023/NĐ-CP","q":"Cụ ông neo đơn, không có điện thoại, không đi họp thôn được. Trưởng thôn nên làm gì để cụ vẫn nắm thông tin và được tham gia ý kiến?","o":["Thông báo trực tiếp, nhờ tổ liên gia đến thăm, ghi nhận ý kiến hoặc lấy ý kiến bằng phiếu","Để cụ tự tìm hiểu thông tin họp thôn qua nhóm Zalo như những người dân khác trong thôn","Coi như cụ không có ý kiến gì vì cụ không đến họp và không có điện thoại để liên lạc, miễn là công trình kịp hoàn thành đúng kế hoạch","Mời cụ đến họp bằng được dù sức khỏe còn yếu để bảo đảm cụ được tham gia biểu quyết, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Trưởng thôn nắm tình hình đời sống cộng đồng (Điều 6 khoản 2 điểm b), và thông báo họp có thể trực tiếp đến từng hộ (Nghị định 59/2023). Với người cao tuổi neo đơn, đến thăm, hỏi ý kiến, dùng phiếu lấy ý kiến, phối hợp Hội Người cao tuổi hoặc tổ liên gia là cách vừa tôn trọng quyền tham gia, vừa thể hiện nghĩa tình.\nVì sao các phương án còn lại chưa đúng: cụ không có điện thoại nên Zalo không đến được; coi như không có ý kiến là bỏ quên quyền của dân; ép đi họp dù yếu là thiếu quan tâm.","t":"Người cao tuổi neo đơn: đến tận nhà, hỏi ý kiến, quan tâm đời sống.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"F","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm b, d; Luật 10/2022/QH15 · Điều 26","q":"Trên Zalo, Facebook xuất hiện bài phản ánh chưa chính xác về một chủ trương của xã, nhiều người lo lắng. Trưởng thôn nên làm gì?","o":["Cung cấp thông tin chính xác, đối thoại với dân, tiếp nhận ý kiến, báo cáo UBND cấp xã","Nhắn tin trách móc người đăng bài và yêu cầu họ không được đăng những nội dung như vậy","Giữ im lặng vì cho rằng những chuyện trên mạng xã hội không liên quan đến công việc thôn","Yêu cầu mọi người xóa bài và không bàn luận về chủ trương đó thêm trên mạng nữa"],"e":"Điều 5 khoản 2 điểm b, d nêu việc tổng hợp, phản ánh ý kiến, nguyện vọng của Nhân dân và phối hợp công khai thông tin, tạo điều kiện để Nhân dân tiếp cận thông tin. Mạng xã hội hoạt động hợp pháp cũng là một kênh để Nhân dân tham gia ý kiến (Điều 26 Luật).\nGiải pháp tốt nhất là cung cấp thông tin chính xác, mở đối thoại, lắng nghe nỗi lo và báo cáo UBND cấp xã để có hướng dẫn thống nhất.\nVì sao các phương án còn lại chưa đúng: trách móc làm căng thẳng thêm; im lặng để tin đồn lan rộng; yêu cầu xóa bài, cấm bàn luận trái tinh thần dân chủ.","t":"Tin chưa chính xác: thông tin đúng, đối thoại, báo cáo xã, không trách móc, không cấm.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"F","y":"NH","r":"Luật Đất đai 2024 · Điều 79 khoản 1, Điều 87; NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm a","q":"Tuyến đường liên thôn đã được cộng đồng thống nhất, nhưng đi qua đất hộ B và hộ này nhất quyết không đồng ý. Trưởng thôn xử lý thế nào là phù hợp?","o":["Không ép buộc; vận động, tìm phương án điều chỉnh tuyến; nếu vẫn cần, báo UBND cấp xã để thực hiện theo trình tự pháp luật","Cho thi công qua đất hộ B vì đa số hộ trong thôn đã đồng ý với chủ trương làm đường và không phải giải thích thêm cho các hộ trong thôn","Nhờ nhóm thanh niên của thôn rào chắn, không cho hộ B vào canh tác để buộc phải đồng ý","Xóa hộ B khỏi danh sách hưởng chính sách của thôn cho đến khi hộ B chấp thuận mà không cần hỏi ý kiến thêm của người dân"],"e":"Đa số hộ đồng ý chủ trương làm đường không có nghĩa là có quyền lấy đất của một hộ. Cách phù hợp là gặp hộ B, nghe lý do, giải thích lợi ích chung, xem xét điều chỉnh tuyến hoặc phương án cho hài hòa, đồng thời báo cáo Ủy ban nhân dân cấp xã. Nếu công trình thật sự cần thu hồi đất vì mục đích công cộng (đường nông thôn thuộc Điều 79 khoản 1), thì do cơ quan nhà nước có thẩm quyền thực hiện theo trình tự, thủ tục, có bồi thường, hỗ trợ (Điều 87).\nVì sao các phương án còn lại chưa đúng: đa số biểu quyết, rào chắn hay cắt chính sách đều xâm phạm quyền của người sử dụng đất và trái pháp luật.","t":"Không ép dân hiến đất: vận động, điều chỉnh phương án; nếu cần thu hồi thì UBND làm theo luật.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-dat-dai-119240221224513596.htm"},{"s":"H","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 1","q":"Theo Nghị định 185/2026/NĐ-CP, hoạt động tự quản của thôn, tổ dân phố do ai thảo luận, quyết định và tổ chức thực hiện?","o":["Cộng đồng dân cư, trên cơ sở tự nguyện và phù hợp với pháp luật, hương ước, quy ước","Trưởng thôn, Tổ trưởng tổ dân phố, sau khi có chỉ đạo của Ủy ban nhân dân cấp xã","Ủy ban nhân dân cấp xã, thôn chỉ thực hiện theo kế hoạch được giao hằng năm, miễn là công trình kịp hoàn thành đúng kế hoạch","Ban Công tác Mặt trận, còn người dân chỉ tham gia theo sự phân công chung, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Điều 5 khoản 1: hoạt động tự quản của thôn, tổ dân phố do cộng đồng dân cư thảo luận, quyết định và tổ chức thực hiện trên cơ sở tự nguyện, phù hợp với quy định của pháp luật; hương ước, quy ước; phong tục, tập quán, truyền thống và điều kiện thực tế của từng thôn, tổ dân phố. Điều 3 khoản 2 yêu cầu bảo đảm và đề cao tính tự quản của cộng đồng dân cư.\nVì sao các phương án còn lại chưa đúng: Trưởng thôn, UBND cấp xã hay Ban Công tác Mặt trận có vai trò tổ chức, hướng dẫn, phối hợp; quyền bàn và quyết định các việc tự quản thuộc về cộng đồng.","t":"Tự quản: dân tự bàn, tự quyết, tự tổ chức thực hiện; tự nguyện, đúng pháp luật, hợp hương ước, quy ước.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"H","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 1 điểm a, b, d","q":"Việc nào dưới đây thuộc hoạt động tự quản của cộng đồng dân cư ở thôn theo Nghị định 185/2026/NĐ-CP?","o":["Bàn mức đóng góp để sửa đường ngõ xóm, rồi tự quản lý thu, chi khoản đóng góp đó","Quyết định mức thuế sử dụng đất phi nông nghiệp mà các hộ trong thôn phải nộp","Tự cấp giấy xác nhận tình trạng hôn nhân cho người dân khi họ có yêu cầu mà không cần hỏi ý kiến thêm của người dân","Tự xử phạt vi phạm hành chính đối với hộ không tham gia họp thôn hằng tháng và không phải giải thích thêm cho các hộ trong thôn"],"e":"Điều 5 khoản 1 liệt kê các việc tự quản như: bàn và quyết định chủ trương, mức đóng góp xây dựng, sửa chữa hạ tầng, công trình phúc lợi công cộng trong phạm vi thôn (điểm a); thu, chi, quản lý các khoản đóng góp (điểm b); xây dựng hương ước, quy ước (điểm c); tổ chức giữ gìn an ninh trật tự, bảo vệ môi trường, tương trợ giúp đỡ nhau (điểm d, g).\nVì sao các phương án còn lại chưa đúng: thuế do pháp luật quy định, giấy xác nhận và xử phạt vi phạm hành chính thuộc thẩm quyền của cơ quan nhà nước, không phải việc tự quản của cộng đồng.","t":"Tự quản: việc nội bộ cộng đồng (đóng góp, quỹ, hương ước, tương trợ). Thuế, giấy tờ, xử phạt: thẩm quyền nhà nước.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"H","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 3 khoản 3","q":"Một nguyên tắc quan trọng về hoạt động của thôn, tổ dân phố theo Nghị định 185/2026/NĐ-CP là gì?","o":["Phân định rõ nhiệm vụ tự quản của cộng đồng với nhiệm vụ hỗ trợ quản lý nhà nước của chính quyền cấp xã","Hợp nhất nhiệm vụ tự quản của cộng đồng vào nhiệm vụ quản lý nhà nước của chính quyền cấp xã","Chỉ thực hiện nhiệm vụ do chính quyền cấp xã giao, không cần bàn bạc với cộng đồng, miễn là công trình kịp hoàn thành đúng kế hoạch","Chỉ tuân thủ hương ước, quy ước; không bắt buộc tuân thủ pháp luật, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Điều 3 khoản 3: hoạt động của thôn, tổ dân phố phải tuân thủ Hiến pháp, pháp luật, hương ước, quy ước của cộng đồng dân cư; bảo đảm dân chủ, công khai, minh bạch; phân định rõ nhiệm vụ tự quản của cộng đồng dân cư với nhiệm vụ hỗ trợ hoạt động quản lý nhà nước của chính quyền địa phương cấp xã.\nVì sao các phương án còn lại chưa đúng: thôn không phải một cấp chính quyền; hương ước, quy ước không được đặt trên pháp luật.","t":"Phân định rõ: việc tự quản của dân khác với việc hỗ trợ chính quyền cấp xã quản lý nhà nước.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"H","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 1 (phần mở đầu, điểm h); Điều 3 khoản 3","q":"Thôn muốn ghi vào quy ước: hộ vắng họp thôn không có lý do sẽ bị phạt tiền. Đề xuất này có phù hợp không?","o":["Không phù hợp: tự quản phải đúng pháp luật, việc xử phạt không thuộc thẩm quyền của thôn","Phù hợp, vì cộng đồng đã đồng thuận thì có thể tự đặt mọi mức phạt cho các hộ","Phù hợp, nếu đa số hộ giơ tay đồng ý ngay tại cuộc họp thôn đầu tiên mà không cần hỏi ý kiến thêm của người dân","Phù hợp, nếu Trưởng thôn trực tiếp thu tiền và chỉ báo cáo bằng miệng và không phải giải thích thêm cho các hộ trong thôn"],"e":"Hoạt động tự quản chỉ được thực hiện phù hợp với quy định của pháp luật (Điều 5 khoản 1), các việc tự quản khác không được trái pháp luật, phù hợp thuần phong, mỹ tục, đạo đức xã hội (điểm h), và thôn phải tuân thủ Hiến pháp, pháp luật (Điều 3 khoản 3). Cộng đồng có thể vận động, nhắc nhở, biểu dương. Nghị định 61/2023/NĐ-CP Điều 5 khoản 4 cho phép quy ước có biện pháp thưởng, phạt phù hợp nhưng không thay thế việc xử lý theo pháp luật; phạt tiền như một chế tài xử phạt thuộc thẩm quyền cơ quan nhà nước, và Luật Thực hiện dân chủ ở cơ sở không quy định nghĩa vụ phải dự họp để bị chế tài vì vắng mặt.\nVì sao các phương án còn lại chưa đúng: số đông đồng ý cũng không làm cho nội dung trái pháp luật trở thành hợp pháp.","t":"Tự quản không vượt khuôn khổ pháp luật: dân đồng ý cũng không được tự đặt ra mức phạt.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"H","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm a, b","q":"Việc nào dưới đây thuộc hoạt động phối hợp, hỗ trợ chính quyền địa phương cấp xã tại thôn?","o":["Tuyên truyền, vận động Nhân dân thực hiện chủ trương, chính sách, pháp luật; tổng hợp, phản ánh ý kiến, kiến nghị của dân","Tự quyết định việc thu hồi đất của các hộ dân để làm công trình công cộng trong thôn, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Tự giải quyết khiếu nại, tố cáo thay cho cơ quan có thẩm quyền khi có đơn của người dân","Tự đặt ra các khoản thu bắt buộc đối với mọi hộ để phục vụ công việc của chính quyền, miễn là công trình kịp hoàn thành đúng kế hoạch"],"e":"Điều 5 khoản 2: hoạt động phối hợp, hỗ trợ chính quyền cấp xã được thực hiện trên cơ sở hướng dẫn của chính quyền cấp xã, phù hợp với chức năng tự quản của cộng đồng: tuyên truyền, vận động Nhân dân thực hiện chủ trương, chính sách, pháp luật (điểm a); tổng hợp, phản ánh ý kiến, nguyện vọng, kiến nghị chính đáng của Nhân dân (điểm b); hỗ trợ cung cấp, trao đổi thông tin (điểm c); phối hợp công khai thông tin (điểm d)…\nVì sao các phương án còn lại chưa đúng: quyết định thu hồi đất, giải quyết khiếu nại, tố cáo, thu bắt buộc là thẩm quyền của cơ quan nhà nước, thôn chỉ phối hợp, hỗ trợ.","t":"Thôn hỗ trợ cấp xã: tuyên truyền, vận động, phản ánh ý kiến của dân, trao đổi thông tin, công khai.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"I","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm đ","q":"Khi triển khai chương trình xây dựng nông thôn mới tại thôn, Nghị định 185/2026/NĐ-CP định hướng cách làm nào?","o":["Tham gia trên cơ sở vận động, tạo sự đồng thuận của Nhân dân, phù hợp điều kiện thực tế của địa bàn","Giao chỉ tiêu cứng cho từng hộ, hộ nào chưa thực hiện thì Trưởng thôn tự quyết định cách xử lý và không phải giải thích thêm cho các hộ trong thôn","Chỉ thông báo kế hoạch của cấp trên, không cần lắng nghe ý kiến nhưng phải bảo đảm đúng tiến độ","Tập trung làm nhanh những việc dễ, những nội dung còn lại để cấp trên giải quyết sau mà không cần hỏi ý kiến thêm của người dân"],"e":"Điều 5 khoản 2 điểm đ: thôn tham gia, phối hợp thực hiện các chương trình, kế hoạch phát triển kinh tế - xã hội, xây dựng nông thôn mới, đô thị văn minh và các hoạt động cộng đồng khác trên cơ sở vận động, tạo sự đồng thuận của Nhân dân và phù hợp với điều kiện thực tế của địa bàn.\nVì sao các phương án còn lại chưa đúng: áp đặt chỉ tiêu, bỏ qua ý kiến người dân hoặc làm cho xong việc đều trái với yêu cầu vận động, tạo sự đồng thuận.","t":"Làm việc với dân: vận động, tạo đồng thuận, phù hợp thực tế, không áp đặt.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"I","y":"NH","r":"Kinh nghiệm thực tiễn; NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm a, đ","q":"Để vận động người dân tự nguyện tham gia một việc chung của thôn, cách làm nào thường hiệu quả nhất?","o":["Nói rõ lợi ích, cách làm, nguồn lực; lắng nghe lo ngại; nhờ người có uy tín và cán bộ, đảng viên gương mẫu làm trước","Chỉ nhắc đi nhắc lại chủ trương của cấp trên bằng loa, tránh để người dân đặt câu hỏi tại cuộc họp","Ghi tên những hộ chưa đồng ý vào danh sách rồi đọc công khai để tạo áp lực lên các hộ đó, miễn là công trình kịp hoàn thành đúng kế hoạch","Chờ đến lúc đã làm xong phần lớn việc rồi mới thông báo cho các hộ còn lại biết để cùng thực hiện, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Kinh nghiệm thực tiễn cho thấy vận động có kết quả khi người dân hiểu rõ việc làm để làm gì, ai hưởng lợi, đóng góp thế nào, được nghe và được trả lời thắc mắc. Cán bộ, đảng viên và người có uy tín làm gương sẽ tạo niềm tin. Điều 5 khoản 2 điểm a, đ Nghị định 185/2026 xác định vai trò tuyên truyền, vận động và tạo sự đồng thuận. (Phần cách làm cụ thể là kinh nghiệm, không phải quy định bắt buộc.)\nVì sao các phương án còn lại chưa đúng: áp lực công khai, một chiều hay làm trước báo sau đều dễ gây phản ứng, mất niềm tin.","t":"Vận động: nói rõ lợi ích, lắng nghe, người uy tín và đảng viên làm gương, không ép buộc.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"I","y":"NH","r":"Kinh nghiệm thực tiễn","q":"Một hộ chưa đồng ý với chủ trương chung vì lo mất quyền lợi. Bước đầu tiên nên làm là gì?","o":["Gặp riêng, lắng nghe lý do, giải thích thông tin chính xác, ghi nhận ý kiến để báo lại cho cuộc họp","Báo ngay với Ủy ban nhân dân cấp xã để yêu cầu xử lý hộ này, dù chưa trao đổi với hộ","Bỏ qua hộ này vì chủ trương đã được đa số đồng ý, không cần thêm bất kỳ trao đổi nào mà không cần hỏi ý kiến thêm của người dân","Nhờ nhiều người đến nhà hộ đó cùng một lúc để thuyết phục cho nhanh chóng và không phải giải thích thêm cho các hộ trong thôn"],"e":"Người dân phản đối thường vì chưa hiểu rõ hoặc lo ngại quyền lợi. Gặp trực tiếp, lắng nghe, giải thích bằng số liệu, văn bản chính xác và ghi nhận ý kiến là bước đầu nên làm. Ý kiến của dân cần được tôn trọng và phản ánh đầy đủ, kể cả khi chưa đạt đồng thuận. (Kinh nghiệm thực tiễn, không phải điều luật.)\nVì sao các phương án còn lại chưa đúng: báo xử lý ngay, bỏ qua hoặc kéo đông người tới gây áp lực đều làm tăng căng thẳng và trái tinh thần tôn trọng ý kiến của dân.","t":"Hộ chưa đồng ý: lắng nghe, giải thích đúng, ghi nhận ý kiến; không gây áp lực."},{"s":"I","y":"NH","r":"Luật Đất đai 2024 (31/2024/QH15) · Điều 79 khoản 1, Điều 82 khoản 2; Cẩm nang","q":"Điểm khác nhau cơ bản giữa người dân tự nguyện hiến đất làm đường và Nhà nước thu hồi đất để xây đường nông thôn là gì?","o":["Hiến đất xuất phát từ ý nguyện tự nguyện của người sử dụng đất; thu hồi đất là quyết định của cơ quan nhà nước theo luật","Hiến đất do Trưởng thôn quyết định; thu hồi đất do cộng đồng biểu quyết theo đa số","Hiến đất không cần làm thủ tục gì; thu hồi đất thì phải làm thủ tục, miễn là công trình kịp hoàn thành đúng kế hoạch","Không có khác biệt: hai việc đều thực hiện theo quyết định chung của cuộc họp thôn, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Hiến đất là cách gọi thường dùng cho việc người sử dụng đất tự nguyện trao đất cho cộng đồng làm công trình; về pháp lý được thực hiện theo hình thức luật cho phép (như tặng cho hoặc tự nguyện trả lại đất khi có đơn, Điều 82 khoản 2 Luật Đất đai 2024). Thu hồi đất vì mục đích công cộng, trong đó có đường nông thôn (Điều 79 khoản 1), là việc cơ quan nhà nước có thẩm quyền quyết định theo trình tự, thủ tục của Luật, kèm bồi thường, hỗ trợ, tái định cư.\nVì sao các phương án còn lại chưa đúng: cuộc họp thôn hay Trưởng thôn không có quyền quyết định lấy đất của hộ dân; hiến đất vẫn phải làm thủ tục; hai việc có bản chất khác nhau.","t":"Hiến đất: dân tự nguyện. Thu hồi đất: Nhà nước quyết định theo luật, có bồi thường. Thôn không có quyền lấy đất của dân.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-dat-dai-119240221224513596.htm"},{"s":"I","y":"NH","r":"Luật Đất đai 2024 (31/2024/QH15) · Điều 82 khoản 2; Cẩm nang (kinh nghiệm)","q":"Hộ ông A đồng ý hiến một phần đất để mở rộng đường liên thôn. Trưởng thôn nên làm gì để việc hiến đất bảo đảm đúng pháp luật?","o":["Hướng dẫn hộ làm văn bản, thủ tục theo quy định tại Ủy ban nhân dân cấp xã; công khai kết quả và ghi nhận sự đóng góp","Ghi nhận bằng lời nói trong cuộc họp rồi cho thi công ngay, thủ tục tính sau khi hoàn thành","Tự lập giấy xác nhận hiến đất bằng chữ ký của Trưởng thôn để thay cho mọi thủ tục khác mà không cần hỏi ý kiến thêm của người dân","Chỉ cần nhắn tin Zalo xác nhận, không cần văn bản vì đây là việc hoàn toàn tự nguyện và không phải giải thích thêm cho các hộ trong thôn"],"e":"Dù hiến đất là tự nguyện, quyền sử dụng đất vẫn là tài sản của người dân. Việc đồng ý phải được thể hiện bằng văn bản và làm thủ tục tại cơ quan có thẩm quyền (Ủy ban nhân dân cấp xã hướng dẫn, đo đạc, xác nhận; tùy trường hợp là tặng cho hoặc tự nguyện trả lại đất theo đơn, Điều 82 khoản 2 Luật Đất đai 2024). Việc công khai và ghi nhận sự đóng góp giúp tạo niềm tin. (Hình thức pháp lý cụ thể phụ thuộc từng trường hợp; cần hỏi cán bộ địa chính cấp xã.)\nVì sao các phương án còn lại chưa đúng: lời nói, tin nhắn hay giấy xác nhận của Trưởng thôn không thay được thủ tục về đất; làm trước, hoàn thiện sau dễ phát sinh tranh chấp.","t":"Hiến đất: phải có văn bản và thủ tục tại UBND xã; không chỉ nói miệng; công khai, ghi nhận đóng góp.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-dat-dai-119240221224513596.htm"},{"s":"I","y":"NH","r":"Luật Đất đai 2024 (31/2024/QH15) · Điều 87 khoản 1","q":"Trước khi thông báo thu hồi đất, cuộc họp với người dân nơi có đất bị thu hồi do cơ quan nào chủ trì?","o":["Ủy ban nhân dân cấp xã nơi có đất, phối hợp với Ủy ban MTTQ Việt Nam cấp xã","Trưởng thôn, khi đó Ủy ban nhân dân cấp xã chỉ cần cử cán bộ dự theo yêu cầu","Ban Công tác Mặt trận của thôn, các cơ quan nhà nước còn lại không tham gia","Đơn vị thi công công trình, vì đơn vị này trực tiếp cần mặt bằng để làm đường"],"e":"Điều 87 khoản 1 Luật Đất đai 2024: trước khi thông báo thu hồi đất, Ủy ban nhân dân cấp xã nơi có đất thu hồi chủ trì phối hợp với Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã, tổ chức làm nhiệm vụ bồi thường, hỗ trợ, tái định cư và các bên liên quan tổ chức họp với người dân trong khu vực thu hồi đất để phổ biến chủ trương, chính sách. Trưởng thôn hỗ trợ thông báo, vận động người dân dự họp và phản ánh ý kiến.\nVì sao các phương án còn lại chưa đúng: Trưởng thôn và Ban Công tác Mặt trận hỗ trợ nhưng không chủ trì; đơn vị thi công không phải bên chủ trì.","t":"Họp dân về thu hồi đất: UBND xã chủ trì, phối hợp MTTQ xã. Trưởng thôn hỗ trợ, vận động.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-dat-dai-119240221224513596.htm"},{"s":"I","y":"NH","r":"Luật Đất đai 2024 (31/2024/QH15) · Điều 87","q":"Phương án bồi thường, hỗ trợ, tái định cư khi thu hồi đất phải được niêm yết công khai tại xã và điểm sinh hoạt khu dân cư trong bao lâu?","o":["30 ngày","07 ngày","15 ngày","60 ngày"],"e":"Đơn vị làm nhiệm vụ bồi thường, hỗ trợ, tái định cư phối hợp với Ủy ban nhân dân cấp xã niêm yết công khai dự thảo phương án tại trụ sở và điểm sinh hoạt khu dân cư trong 30 ngày, sau đó tổ chức họp lấy ý kiến, lập biên bản và đối thoại nếu còn ý kiến chưa đồng ý (Điều 87).\nTrưởng thôn nên nhắc người dân xem phương án, góp ý đúng hạn và hỗ trợ họ hiểu nội dung.\nVì sao các phương án còn lại chưa đúng: 7, 15 hay 60 ngày không phải thời hạn niêm yết do Luật quy định.","t":"Niêm yết phương án bồi thường, hỗ trợ, tái định cư: 30 ngày.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-dat-dai-119240221224513596.htm"},{"s":"I","y":"NH","r":"Luật Đất đai 2024 (31/2024/QH15) · Điều 87","q":"Trong thu hồi đất vì mục đích công cộng, một hộ chưa đồng ý với phương án bồi thường. Việc nào dưới đây phù hợp với quy định?","o":["Ghi nhận ý kiến, tổ chức đối thoại, vận động theo đúng trình tự; quyết định thu hồi do cơ quan có thẩm quyền ban hành","Trưởng thôn quyết định thu hồi đất của hộ đó để làm kịp tiến độ công trình đường nông thôn","Cuộc họp thôn biểu quyết đa số để tước quyền sử dụng đất của hộ không đồng ý, miễn là công trình kịp hoàn thành đúng kế hoạch","Cắt các khoản hỗ trợ khác của thôn đối với hộ chưa đồng ý để các hộ còn lại làm theo, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Luật Đất đai 2024 quy định người có đất được tham gia ý kiến, được đối thoại và được vận động, thuyết phục theo trình tự; quyết định thu hồi đất do cơ quan nhà nước có thẩm quyền ban hành (Điều 87). Trưởng thôn không có thẩm quyền thu hồi đất hay cưỡng chế, vai trò là hỗ trợ truyền đạt thông tin, vận động, phản ánh ý kiến.\nVì sao các phương án còn lại chưa đúng: thôn và Trưởng thôn không có quyền thu hồi đất hay tước quyền sử dụng đất; cắt hỗ trợ để gây áp lực là trái nguyên tắc công bằng.","t":"Thu hồi đất: UBND có thẩm quyền quyết định. Trưởng thôn chỉ vận động, truyền đạt, phản ánh ý kiến.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-dat-dai-119240221224513596.htm"},{"s":"I","y":"NH","r":"Luật Đất đai 2024 (31/2024/QH15) · Điều 91","q":"Nguyên tắc nào dưới đây phải được bảo đảm khi bồi thường, hỗ trợ, tái định cư cho người có đất bị thu hồi?","o":["Dân chủ, khách quan, công bằng, công khai, minh bạch, kịp thời và đúng quy định của pháp luật","Ưu tiên người đã đồng ý sớm, những hộ còn lại xem xét sau và có thể hưởng mức thấp hơn","Mỗi thôn tự thỏa thuận mức bồi thường riêng, không phụ thuộc vào quy định chung mà không cần hỏi ý kiến thêm của người dân","Giữ kín phương án cho đến khi có quyết định cuối cùng để tránh người dân bàn luận và không phải giải thích thêm cho các hộ trong thôn"],"e":"Điều 91 Luật Đất đai 2024 quy định việc bồi thường, hỗ trợ, tái định cư phải bảo đảm dân chủ, khách quan, công bằng, công khai, minh bạch, kịp thời và đúng quy định của pháp luật. Vì vậy cán bộ thôn cần giúp công khai thông tin, không làm khác nhau giữa các hộ.\nVì sao các phương án còn lại chưa đúng: ưu tiên theo mức độ đồng ý, tự thỏa thuận mức riêng hay giữ kín phương án đều trái nguyên tắc công bằng, công khai.","t":"Bồi thường thu hồi đất: dân chủ, khách quan, công bằng, công khai, minh bạch, kịp thời, đúng luật.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-dat-dai-119240221224513596.htm"},{"s":"J","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 3 khoản 5","q":"Theo Nghị định 185/2026/NĐ-CP, việc ứng dụng công nghệ thông tin, chuyển đổi số trong tổ chức và hoạt động của thôn, tổ dân phố nhằm mục đích chính nào?","o":["Nâng cao hiệu quả tự quản, giúp Nhân dân tiếp cận thông tin, tham gia hoạt động cộng đồng và phối hợp với chính quyền cấp xã","Thay thế hoàn toàn các cuộc họp trực tiếp của thôn bằng họp trực tuyến để tiết kiệm thời gian cho cán bộ thôn, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Bắt buộc mọi hộ dân phải có điện thoại thông minh và tài khoản mạng xã hội mới được tham gia việc chung mà không cần hỏi ý kiến thêm của người dân","Giúp chính quyền cấp xã theo dõi, quản lý trực tiếp mọi sinh hoạt cá nhân của người dân trong thôn và không phải giải thích thêm cho các hộ trong thôn"],"e":"Điều 3 khoản 5: tăng cường ứng dụng công nghệ thông tin, chuyển đổi số trong tổ chức và hoạt động của thôn, tổ dân phố nhằm nâng cao hiệu quả hoạt động tự quản của cộng đồng dân cư, tạo thuận lợi cho Nhân dân trong tiếp cận thông tin, tham gia các hoạt động cộng đồng và phối hợp với chính quyền địa phương cấp xã trong các hoạt động tại địa bàn.\nVì sao các phương án còn lại chưa đúng: công nghệ là công cụ hỗ trợ, không thay thế việc họp, biểu quyết trực tiếp theo Luật; không được biến thành điều kiện bắt buộc đối với người dân.","t":"Chuyển đổi số ở thôn: để dân dễ biết, dễ tham gia, tự quản hiệu quả hơn; công cụ hỗ trợ, không bắt buộc.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"J","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm e","q":"Theo Nghị định 185/2026/NĐ-CP, thôn có vai trò gì trong chuyển đổi số tại cộng đồng dân cư?","o":["Hỗ trợ triển khai chuyển đổi số; tuyên truyền, hướng dẫn người dân dùng nền tảng số, dịch vụ công trực tuyến, ứng dụng công nghệ thông tin","Tự xây dựng và vận hành riêng một nền tảng dữ liệu dân cư của thôn, không cần phối hợp với chính quyền cấp xã, miễn là kịp hoàn thành đúng kế hoạch","Thu phí hướng dẫn sử dụng dịch vụ công trực tuyến đối với những hộ dân nhờ cán bộ thôn làm thay, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Chỉ báo cáo số liệu lên cấp xã, việc hướng dẫn người dân dùng dịch vụ số thuộc trách nhiệm riêng của từng hộ mà không cần hỏi ý kiến thêm của người dân"],"e":"Điều 5 khoản 2 điểm e: hoạt động phối hợp, hỗ trợ chính quyền cấp xã gồm hỗ trợ triển khai chuyển đổi số tại cộng đồng dân cư; tuyên truyền, hướng dẫn người dân sử dụng các nền tảng số, dịch vụ công trực tuyến và các ứng dụng công nghệ thông tin phục vụ đời sống xã hội.\nVì sao các phương án còn lại chưa đúng: thôn làm trên cơ sở hướng dẫn của chính quyền cấp xã (Điều 5 khoản 2); hướng dẫn người dân là nhiệm vụ hỗ trợ, không được thu phí; thôn không tự lập cơ sở dữ liệu riêng ngoài quy định.","t":"Thôn hỗ trợ chuyển đổi số: tuyên truyền, hướng dẫn dân dùng nền tảng số, dịch vụ công trực tuyến.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"J","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm d; Luật 10/2022/QH15 · Điều 13","q":"Thôn công khai quyết toán công trình trên nhóm Zalo, nhưng nhiều hộ cao tuổi không dùng điện thoại thông minh. Cách làm nào đúng?","o":["Đăng trên Zalo và đồng thời niêm yết tại nhà văn hóa, thông báo qua loa truyền thanh hoặc cuộc họp thôn","Chỉ đăng trên Zalo vì đây là kênh nhanh nhất, hộ nào cần thì tự nhờ con cháu xem giúp và không phải giải thích thêm cho các hộ trong thôn","Chỉ niêm yết bản giấy tại nhà Trưởng thôn, bỏ qua kênh Zalo để tránh làm phức tạp việc công khai","Đăng bằng hình ảnh khó đọc trên Zalo để hạn chế việc người dân sao chép, lan truyền số liệu, miễn là kịp hoàn thành đúng kế hoạch"],"e":"Điều 5 khoản 2 điểm d giao thôn phối hợp công khai thông tin, tạo điều kiện để Nhân dân tiếp cận thông tin. Luật Thực hiện dân chủ ở cơ sở quy định các hình thức công khai như niêm yết tại trụ sở và nhà văn hóa, truyền thanh cơ sở (Điều 13). Kênh số giúp thông tin đến nhanh, nhưng phải đi cùng kênh truyền thống để không ai bị bỏ lại phía sau.\nVì sao các phương án còn lại chưa đúng: chỉ dùng một kênh thì hộ không có điều kiện sẽ không biết; làm khó đọc là trái tinh thần công khai, minh bạch.","t":"Công khai số + niêm yết, loa, họp thôn: kênh số không được thay thế kênh truyền thống.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"J","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm e (kinh nghiệm hướng dẫn)","q":"Một cụ ông muốn làm thủ tục trên cổng dịch vụ công nhưng không biết thao tác. Cách hướng dẫn nào đúng và an toàn nhất?","o":["Hướng dẫn từng bước hoặc nhờ người trẻ tin cậy trong thôn hỗ trợ; để cụ tự nhập mật khẩu, không giữ mã xác thực của cụ","Xin mật khẩu và mã xác thực của cụ để cán bộ thôn thao tác thay cho nhanh, xong rồi báo lại sau, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Khuyên cụ bỏ qua thủ tục trực tuyến, vì việc này chỉ dành cho người trẻ biết sử dụng điện thoại mà không cần hỏi ý kiến thêm của người dân","Nhờ một người ngoài thôn không quen biết làm hộ qua mạng, mất phí, rồi gửi kết quả lại cho cụ và không phải giải thích thêm cho các hộ trong thôn"],"e":"Điều 5 khoản 2 điểm e giao thôn hướng dẫn người dân sử dụng dịch vụ công trực tuyến. Trong thực tế, cần hướng dẫn tận tình, đồng thời bảo vệ thông tin cá nhân: không giữ mật khẩu, mã OTP của người dân; ưu tiên người hỗ trợ đáng tin cậy ở địa phương. (Cách làm cụ thể là kinh nghiệm thực tiễn.)\nVì sao các phương án còn lại chưa đúng: nắm mật khẩu và mã xác thực rất rủi ro cho người dân và cho cán bộ; bỏ mặc người dân hoặc nhờ người lạ làm trái mục tiêu hỗ trợ.","t":"Hướng dẫn dân dùng dịch vụ số: giúp từng bước, không giữ mật khẩu, mã OTP của dân.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"J","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 3 khoản 5, Điều 5 khoản 2 điểm c, d (kinh nghiệm quản lý nhóm)","q":"Để nhóm Zalo thôn thật sự hữu ích và an toàn, cách quản lý nào phù hợp?","o":["Có quy chế ngắn gọn; chỉ đăng thông tin đã kiểm chứng; nhắc không chia sẻ tin chưa xác thực và thông tin cá nhân của người khác","Cho phép đăng mọi nội dung để người dân tự do thể hiện ý kiến, cán bộ thôn không cần nhắc nhở hay kiểm tra, miễn là kịp hoàn thành đúng kế hoạch","Chỉ cho phép cán bộ thôn đăng bài, mọi ý kiến của người dân phải nhắn riêng và không được đưa lên nhóm, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Xóa ngay thành viên nêu ý kiến trái chiều và không giải thích lý do, để nhóm không có tranh cãi mà không cần hỏi ý kiến thêm của người dân"],"e":"Nhóm Zalo là công cụ thông tin và trao đổi của cộng đồng (Điều 3 khoản 5; Điều 5 khoản 2 điểm c, d). Quy chế đơn giản về nội dung được đăng, kiểm chứng tin, bảo vệ thông tin cá nhân, giữ thái độ văn minh sẽ giúp nhóm đáng tin cậy, đồng thời vẫn tiếp nhận ý kiến của dân. (Kinh nghiệm thực tiễn.)\nVì sao các phương án còn lại chưa đúng: thả nổi dễ lan tin sai; chỉ một chiều làm mất kênh phản hồi; xóa thành viên vì ý kiến trái chiều không tôn trọng ý kiến của dân.","t":"Nhóm Zalo thôn: có quy chế, tin đã kiểm chứng, tôn trọng ý kiến, bảo vệ thông tin cá nhân.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"J","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm a (tuyên truyền, vận động); kinh nghiệm","q":"Có người nhắn tin xưng là cán bộ, yêu cầu người dân trong thôn cung cấp mã OTP và mật khẩu để \"cập nhật dữ liệu\". Trưởng thôn nên làm gì?","o":["Cảnh báo người dân không cung cấp mã OTP, mật khẩu cho bất kỳ ai; kiểm tra lại với cơ quan có thẩm quyền qua kênh chính thức","Khuyên người dân cứ làm theo để khỏi bị phạt, sau đó mới báo lại cho cán bộ thôn biết kết quả và không phải giải thích thêm cho các hộ trong thôn","Chuyển tiếp tin nhắn sang tất cả các nhóm Zalo của thôn mà chưa kiểm tra tính chính xác của nội dung, miễn là kịp hoàn thành đúng kế hoạch","Không nói gì với người dân vì đây là việc cá nhân của từng người, cán bộ thôn không có trách nhiệm, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Tuyên truyền, vận động, hướng dẫn người dân sử dụng ứng dụng một cách an toàn là một phần vai trò hỗ trợ ở cơ sở (Điều 5 khoản 2 điểm a, e). Khi gặp tin nhắn nghi lừa đảo, cần nhắc người dân không cung cấp mã OTP, mật khẩu; xác minh với cơ quan có thẩm quyền qua kênh chính thức; thông báo kịp thời cho cộng đồng và báo Công an xã khi cần. (Phần ứng xử cụ thể là kinh nghiệm thực tiễn.)\nVì sao các phương án còn lại chưa đúng: làm theo yêu cầu, chuyển tiếp chưa kiểm chứng hay làm ngơ đều có thể khiến người dân mất tiền và lan rộng tin giả.","t":"Tin nhắn nghi lừa đảo: không cung cấp OTP, mật khẩu; xác minh kênh chính thức; cảnh báo kịp thời.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"K","y":"NH","r":"Kinh nghiệm thực tiễn; NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm b","q":"Trước khi vận động người dân thực hiện một việc chung, bước đầu tiên hợp lý là gì?","o":["Nắm tình hình, tìm hiểu tâm tư và lý do khiến một số hộ chưa đồng thuận","Đưa ngay danh sách hộ phải thực hiện, rồi giao thời hạn cụ thể để hoàn thành","Chọn trước một số hộ làm mẫu, các hộ còn lại phải làm theo, không cần bàn thêm","Tổ chức tuyên truyền rầm rộ một lần, sau đó coi như đã hoàn thành việc vận động"],"e":"Vận động hiệu quả bắt đầu từ nắm tình hình: hộ nào ủng hộ, hộ nào còn băn khoăn, băn khoăn về điều gì (tiền, quyền lợi, thời điểm, cách làm). Việc tổng hợp, phản ánh ý kiến, nguyện vọng của người dân cũng là một nhiệm vụ hỗ trợ ở thôn (Điều 5 khoản 2 điểm b). (Cách làm là kinh nghiệm thực tiễn.)\nVì sao các phương án còn lại chưa đúng: áp đặt, làm mẫu bắt buộc hay tuyên truyền một lần không giải quyết được nguyên nhân khiến người dân chưa đồng thuận.","t":"Vận động: nắm tình hình, hiểu tâm tư trước, rồi mới thuyết phục.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"K","y":"NH","r":"Kinh nghiệm thực tiễn; NĐ 185/2026/NĐ-CP · Điều 3 khoản 4","q":"Để vận động hiệu quả, Trưởng thôn nên phối hợp và lựa chọn người vận động như thế nào?","o":["Phối hợp Ban Công tác Mặt trận, đoàn thể; nhờ người có uy tín, gần gũi, được hộ dân tin tưởng cùng nói chuyện","Chỉ Trưởng thôn trực tiếp đi từng nhà, để tránh người khác nói sai nội dung và làm phức tạp thêm mà không cần hỏi ý kiến thêm của người dân","Nhờ người ngoài thôn không am hiểu hoàn cảnh các hộ, để tránh sự thiên vị trong thuyết phục và không phải giải thích thêm cho các hộ trong thôn","Chọn những người có chức vụ cao nhất, bất kể mối quan hệ và mức độ tin cậy của họ với các hộ, miễn là kịp hoàn thành đúng kế hoạch"],"e":"Điều 3 khoản 4 yêu cầu hoạt động của thôn bảo đảm sự phối hợp chặt chẽ giữa Trưởng thôn với Bí thư Chi bộ, Trưởng Ban Công tác Mặt trận, các tổ chức chính trị - xã hội và lực lượng tham gia bảo vệ an ninh, trật tự ở cơ sở. Khi vận động, người được dân tin (người cao tuổi, trưởng dòng họ, cán bộ đoàn thể, đảng viên gương mẫu) thường dễ thuyết phục hơn. (Cách chọn người là kinh nghiệm thực tiễn.)\nVì sao các phương án còn lại chưa đúng: làm một mình dễ quá tải; người không hiểu hoàn cảnh hoặc không được tin sẽ khó thuyết phục.","t":"Vận động: phối hợp Mặt trận, đoàn thể; chọn người được dân tin.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"K","y":"NH","r":"Luật 10/2022/QH15 · Điều 15 khoản 1, 2; Điều 21 khoản 1","q":"Khi vận động người dân đóng góp xây công trình chung, nguyên tắc nào đúng?","o":["Nói rõ mục đích, dự toán, cách thu, chi; để dân bàn và biểu quyết đạt tỷ lệ theo luật rồi mới thu","Thu trước theo mức do Trưởng thôn đề xuất, sau đó mới họp lấy ý kiến để hợp thức hóa, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Áp mức đóng góp bằng nhau cho mọi hộ, hộ nào không đồng ý sẽ không được hưởng quyền lợi chung","Chỉ cần nhóm cán bộ thôn thống nhất mức đóng góp, rồi thông báo để các hộ thực hiện mà không cần hỏi ý kiến thêm của người dân"],"e":"Chủ trương và mức đóng góp xây dựng hạ tầng, công trình công cộng trong phạm vi thôn là nội dung Nhân dân bàn và quyết định (Điều 15 khoản 1); việc thu, chi, quản lý các khoản đóng góp cũng vậy (khoản 2). Nội dung này cần từ hai phần ba tổng số đại diện hộ gia đình tán thành (Điều 21 khoản 1). Vận động tốt là giải thích rõ mục đích, dự toán, cách thu, chi, rồi để dân quyết định.\nVì sao các phương án còn lại chưa đúng: thu trước hợp thức sau, áp mức cưỡng bức hoặc để cán bộ tự thống nhất đều trái nguyên tắc dân bàn, dân quyết.","t":"Vận động đóng góp: nói rõ mục đích, dự toán; dân bàn, dân quyết (≥ 2/3); sau đó mới thu.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"K","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm b; Điều 6 khoản 1 điểm b","q":"Sau đợt vận động và họp bàn một việc chung, Trưởng thôn nên làm gì tiếp theo?","o":["Tổng hợp kết quả, ý kiến của dân; phản hồi lại cho người dân và báo cáo Ủy ban nhân dân cấp xã","Chỉ báo cáo con số đã đạt, lược bỏ ý kiến chưa đồng tình để báo cáo trông có kết quả hơn","Coi như xong việc, chờ đến kỳ họp thôn sau mới nhắc lại nếu có hộ phản ánh và không phải giải thích thêm cho các hộ trong thôn","Chỉ thông báo riêng cho các hộ ủng hộ, các hộ còn lại sẽ tự biết qua người quen, miễn là kịp hoàn thành đúng kế hoạch"],"e":"Điều 5 khoản 2 điểm b giao thôn tổng hợp, phản ánh ý kiến, nguyện vọng, kiến nghị chính đáng của Nhân dân; Điều 6 khoản 1 điểm b giao Trưởng thôn tổng hợp, báo cáo Ủy ban nhân dân cấp xã về kết quả thực hiện các quyết định của cộng đồng. Phản hồi lại cho dân giúp giữ niềm tin cho những lần vận động sau.\nVì sao các phương án còn lại chưa đúng: báo cáo thiếu trung thực, bỏ lửng hay thông tin có chọn lọc đều làm mất niềm tin và trái nguyên tắc công khai, minh bạch.","t":"Sau vận động: tổng hợp trung thực, phản hồi cho dân, báo cáo UBND xã.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"K","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 6 khoản 1 điểm b; Điều 6 khoản 2 điểm đ (kinh nghiệm triển khai)","q":"Cộng đồng đã thông qua việc làm đường ngõ xóm. Trình tự triển khai nào phù hợp nhất?","o":["Phân công người phụ trách, đặt mốc thời gian; công khai tiến độ; có đại diện dân và Ban Giám sát đầu tư dự nghiệm thu; báo cáo cấp xã","Giao cho một nhà thầu bất kỳ làm xong, rồi thông báo kết quả cho dân khi đã hoàn thành toàn bộ, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Trưởng thôn tự trực tiếp thi công, thu chi và nghiệm thu, để tránh nhiều người tham gia phức tạp mà không cần hỏi ý kiến thêm của người dân","Chia việc cho từng hộ tự làm phần của mình, không cần theo dõi chung hay nghiệm thu tập thể và không phải giải thích thêm cho các hộ trong thôn"],"e":"Điều 6 khoản 1 điểm b giao Trưởng thôn tổ chức thực hiện và theo dõi việc thực hiện các quyết định của cộng đồng; tổng hợp, báo cáo Ủy ban nhân dân cấp xã. Điều 6 khoản 2 điểm đ giao Trưởng thôn tổ chức cho Nhân dân tham gia giám sát công trình, khoản đóng góp. Trình tự hợp lý: phân công, đặt mốc, công khai tiến độ, nghiệm thu có đại diện dân, quyết toán công khai, báo cáo cấp xã. (Các bước chi tiết là kinh nghiệm thực tiễn.)\nVì sao các phương án còn lại chưa đúng: làm khép kín, một mình hay không nghiệm thu sẽ thiếu giám sát của dân và dễ phát sinh tranh chấp.","t":"Triển khai: phân công, mốc thời gian, công khai tiến độ, nghiệm thu có dân, quyết toán, báo cáo.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"K","y":"NH","r":"Luật 10/2022/QH15 · Điều 15, Điều 21 khoản 1; NĐ 185/2026/NĐ-CP · Điều 6 khoản 1 điểm b","q":"Công trình chậm tiến độ do mưa bão, chi phí vật liệu tăng. Trưởng thôn nên xử lý thế nào?","o":["Thông báo lý do cho dân; nếu cần tăng đóng góp thì họp để dân bàn, quyết lại; đồng thời báo cáo UBND cấp xã","Tự tăng mức đóng góp của các hộ cho đủ chi phí, sau đó mới báo lại cho cộng đồng khi công trình xong","Giữ nguyên mức cũ nhưng giảm chất lượng công trình, không cần cho dân biết vì sợ gây tranh cãi, miễn là kịp hoàn thành đúng kế hoạch","Dừng hẳn công trình và không thông báo, chờ đến khi có hộ hỏi mới giải thích lý do cho hộ đó, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Mức đóng góp đã được cộng đồng thông qua với tỷ lệ theo Điều 21 khoản 1 là quyết định của dân. Khi phát sinh chi phí, Trưởng thôn không tự tăng mà phải tổ chức để dân bàn lại (Điều 15, Điều 6 khoản 1 điểm a). Công khai lý do chậm tiến độ và báo cáo UBND cấp xã (Điều 6 khoản 1 điểm b) giúp giữ niềm tin.\nVì sao các phương án còn lại chưa đúng: tự tăng mức, giảm chất lượng hoặc im lặng đều trái nguyên tắc dân bàn, dân quyết, công khai, minh bạch.","t":"Phát sinh chi phí: công khai lý do; dân bàn lại nếu tăng đóng góp; báo cáo UBND xã.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"K","y":"NH","r":"Kinh nghiệm thực tiễn; Luật 10/2022/QH15 · Điều 15 khoản 2","q":"Một hộ có điều kiện nhưng chưa thực hiện khoản đóng góp đã được cộng đồng thông qua. Cách xử lý nào phù hợp?","o":["Tìm hiểu lý do, vận động nhắc nhở nhiều lần, nhờ người có uy tín cùng nói chuyện; xin hướng dẫn của UBND xã nếu cần","Công khai tên hộ này trên nhóm Zalo kèm lời nhắc nhở nặng nề để các hộ khác không làm theo mà không cần hỏi ý kiến thêm của người dân","Tự ý cắt các quyền lợi chung của hộ, như nước sinh hoạt hoặc đường vào nhà, cho đến khi đóng đủ và không phải giải thích thêm cho các hộ trong thôn","Tự thu giữ tài sản của hộ để khấu trừ vào khoản đóng góp chưa nộp, rồi báo lại sau với cộng đồng, miễn là kịp hoàn thành đúng kế hoạch"],"e":"Khoản đóng góp của dân do cộng đồng quyết định trên cơ sở tự nguyện, công khai; Trưởng thôn không có quyền cưỡng chế thu. Cách xử lý phù hợp là tìm hiểu lý do, vận động, kiên trì thuyết phục; nếu có vướng mắc về pháp lý, xin hướng dẫn của Ủy ban nhân dân cấp xã. (Cách ứng xử cụ thể là kinh nghiệm thực tiễn.)\nVì sao các phương án còn lại chưa đúng: nêu tên hộ để gây áp lực, cắt quyền lợi chung hay thu giữ tài sản đều xâm phạm quyền của người dân và trái pháp luật.","t":"Hộ chưa đóng góp: tìm hiểu, vận động, không cưỡng chế, không nêu tên, không cắt quyền lợi.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"L","y":"NH","r":"Luật 10/2022/QH15 · Điều 6 khoản 1, 3, 5","q":"Theo Luật Thực hiện dân chủ ở cơ sở, việc nào dưới đây là nghĩa vụ của công dân?","o":["Tuân thủ pháp luật, chấp hành quyết định của cộng đồng dân cư, tôn trọng trật tự, an toàn xã hội và quyền, lợi ích hợp pháp của người khác","Chỉ thực hiện những quyết định của cộng đồng mà bản thân đã giơ tay tán thành khi dự họp thôn, còn lại thì không bắt buộc, rồi mọi việc sẽ tự ổn định về sau","Đóng mọi khoản tiền do thôn đề ra mà không cần bàn bạc hay công khai, vì đó là nghĩa vụ chung của mọi hộ dân trong thôn và không cần giải thích thêm với bà con trong thôn","Có mặt đầy đủ ở mọi cuộc họp thôn, vắng mặt không có lý do thì bị xử phạt hành chính theo quy định của Luật, miễn là không ai phản ứng ngay lúc đó"],"e":"Điều 6 Luật Thực hiện dân chủ ở cơ sở quy định nghĩa vụ của công dân gồm: tuân thủ pháp luật về thực hiện dân chủ ở cơ sở (khoản 1); tham gia ý kiến về các nội dung được lấy ý kiến (khoản 2); chấp hành quyết định của cộng đồng dân cư, chính quyền địa phương (khoản 3); kịp thời kiến nghị, phản ánh, tố cáo khi phát hiện vi phạm (khoản 4); tôn trọng và bảo đảm trật tự, an toàn xã hội, lợi ích của Nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân (khoản 5).\nVì sao các phương án còn lại chưa đúng: quyết định đúng quy trình của cộng đồng có giá trị với mọi hộ, không chỉ với người đã tán thành; việc đóng góp phải được bàn, công khai theo luật; Luật không quy định xử phạt hành chính chỉ vì vắng họp.","t":"Nghĩa vụ của người dân: tuân thủ pháp luật, tham gia ý kiến, chấp hành quyết định của cộng đồng, kiến nghị đúng chỗ, tôn trọng trật tự và quyền người khác.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"L","y":"NH","r":"Luật 10/2022/QH15 · Điều 6 khoản 3; Điều 15 khoản 2; Điều 21 khoản 1; Cẩm nang (cách vận động)","q":"Hộ ông B vắng họp và không đồng ý mức đóng góp làm đường đã được cộng đồng thông qua đúng tỷ lệ. Nhận định nào đúng?","o":["Quyết định đúng quy trình có giá trị với cả cộng đồng; hộ vẫn có quyền kiến nghị đúng kênh nhưng có trách nhiệm chấp hành, và thôn vận động chứ không cưỡng ép","Quyết định chỉ ràng buộc những hộ đã dự họp và biểu quyết tán thành, hộ vắng mặt hoặc không tán thành thì hoàn toàn không phải thực hiện gì mà không cần xin ý kiến ai khác trong cộng đồng","Hộ không đồng ý được tự động miễn đóng góp vì mọi khoản đóng góp là tự nguyện từng người, cộng đồng không có quyền quyết định thay hộ, vì như vậy sẽ nhanh gọn và đỡ tốn thời gian","Trưởng thôn phải tổ chức họp lại nhiều lần cho đến khi toàn bộ các hộ trong thôn đều đồng ý thì công trình mới được triển khai và coi như đã xong trách nhiệm của mình"],"e":"Mức đóng góp xây dựng công trình chung là nội dung Nhân dân bàn và quyết định (Điều 15 khoản 1, 2); nội dung này cần từ hai phần ba tổng số đại diện hộ gia đình tán thành (Điều 21 khoản 1). Khi đã thông qua đúng quy trình, công dân có nghĩa vụ chấp hành quyết định của cộng đồng (Điều 6 khoản 3), đồng thời vẫn có quyền kiến nghị, phản ánh. Việc thực hiện dựa trên vận động, thuyết phục; Trưởng thôn không có quyền cưỡng chế thu (cách ứng xử cụ thể là kinh nghiệm theo Cẩm nang).\nVì sao các phương án còn lại chưa đúng: quyết định của cộng đồng ràng buộc cả hộ vắng mặt; tự động miễn làm vô hiệu quyết định của dân; luật chỉ yêu cầu đạt tỷ lệ tán thành, không đòi hỏi tất cả các hộ đồng ý.","t":"Đã thông qua đúng quy trình thì hộ có trách nhiệm chấp hành; vẫn được kiến nghị; thôn vận động, không cưỡng ép.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"L","y":"NH","r":"Luật 10/2022/QH15 · Điều 5 khoản 1, 3; Điều 6 khoản 4; NĐ 185/2026/NĐ-CP · Điều 6 khoản 2 điểm đ","q":"Một hộ nghi ngờ khoản đóng góp làm đường của thôn được chi chưa đúng mục đích. Cách làm đúng của người dân là gì?","o":["Đề nghị công khai thu, chi; kiến nghị, phản ánh với Trưởng thôn, Ban Thanh tra nhân dân hoặc UBND cấp xã; có dấu hiệu vi phạm thì tố cáo đến cơ quan có thẩm quyền","Đăng lên mạng xã hội kêu gọi các hộ cùng ngừng đóng góp để gây áp lực, không cần xem lại sổ sách thu, chi của thôn, để tránh phát sinh thêm chuyện rắc rối cho thôn","Tự giữ lại khoản đóng góp của các hộ trong xóm cho đến khi thôn giải trình, không cần thông báo trước cho ai biết trước mặt nhiều người để mọi người cùng biết","Không nên hỏi vì đây là việc riêng của thôn, người dân không có quyền yêu cầu công khai hay kiểm tra thu, chi, rồi mọi việc sẽ tự ổn định về sau và không cần giải thích thêm với bà con trong thôn"],"e":"Công dân có quyền được công khai thông tin, yêu cầu cung cấp thông tin; kiểm tra, giám sát, kiến nghị, phản ánh, khiếu nại, tố cáo (Điều 5 khoản 1, 3) và có nghĩa vụ kịp thời kiến nghị, phản ánh, tố cáo đến cơ quan có thẩm quyền khi phát hiện vi phạm (Điều 6 khoản 4). Nghị định 185/2026 giao Trưởng thôn tổ chức cho Nhân dân tham gia giám sát các khoản đóng góp (Điều 6 khoản 2 điểm đ).\nVì sao các phương án còn lại chưa đúng: kêu gọi ngừng đóng góp hay tự giữ tiền là hành động tự phát, dễ gây rối và không giải quyết được nghi vấn; im lặng là từ bỏ quyền giám sát của chính mình.","t":"Nghi vấn thu, chi: yêu cầu công khai, kiến nghị đúng nơi, có dấu hiệu vi phạm thì tố cáo; không tự phát.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"L","y":"NH","r":"Luật 10/2022/QH15 · Điều 9 khoản 5","q":"Việc nào dưới đây bị nghiêm cấm trong thực hiện dân chủ ở cơ sở?","o":["Giả mạo giấy tờ, gian lận hoặc dùng thủ đoạn khác để làm sai lệch kết quả biểu quyết, quyết định hay ý kiến của người dân","Người dân phát biểu ý kiến phản đối một chủ trương của thôn ngay tại cuộc họp bàn việc chung của cộng đồng dân cư, miễn là không ai phản ứng ngay lúc đó","Người dân kiến nghị với Ủy ban nhân dân cấp xã về việc thôn chưa công khai đầy đủ các khoản thu, chi đóng góp mà không cần xin ý kiến ai khác trong cộng đồng","Người dân đề nghị được cung cấp thông tin về dự toán và quyết toán công trình do chính cộng đồng đóng góp xây dựng"],"e":"Điều 9 Luật Thực hiện dân chủ ở cơ sở nghiêm cấm: gây khó khăn, phiền hà, cản trở, đe dọa công dân thực hiện dân chủ (khoản 1); bao che, cản trở, trù dập hoặc thiếu trách nhiệm khi giải quyết kiến nghị, khiếu nại, tố cáo (khoản 2); lợi dụng dân chủ xâm phạm an ninh quốc gia, trật tự, an toàn xã hội, lợi ích Nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân (khoản 3); lợi dụng dân chủ để xuyên tạc, vu khống, gây mâu thuẫn, kích động bạo lực (khoản 4); giả mạo giấy tờ, gian lận hoặc dùng thủ đoạn khác làm sai lệch kết quả (khoản 5).\nVì sao các phương án còn lại chưa đúng: phát biểu ý kiến, kiến nghị và yêu cầu thông tin đều là quyền chính đáng của công dân (Điều 5), không bị cấm.","t":"Cấm: cản trở, trù dập, xuyên tạc, vu khống, gây mâu thuẫn, giả mạo, gian lận kết quả. Phát biểu, kiến nghị, hỏi thông tin là quyền.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"L","y":"NH","r":"Luật 10/2022/QH15 · Điều 9 khoản 4; Điều 6 khoản 5; Cẩm nang (cách xử lý)","q":"Một người đăng lên nhóm Zalo thôn tin sai sự thật về Trưởng thôn để kích động các hộ chống đối cuộc họp. Nhận định nào đúng?","o":["Đây là hành vi lợi dụng dân chủ để xuyên tạc, vu khống, gây mâu thuẫn mà Luật nghiêm cấm; nên nhắc nhở, yêu cầu gỡ tin và báo UBND cấp xã khi cần","Đây là quyền tự do ngôn luận ở cơ sở, người quản trị nhóm không được can thiệp trong bất kỳ trường hợp nào dù tin có sai sự thật, vì như vậy sẽ nhanh gọn và đỡ tốn thời gian","Chỉ coi là vi phạm khi người đăng tin là cán bộ hoặc đảng viên, còn người dân bình thường thì đăng gì cũng không bị coi là vi phạm và coi như đã xong trách nhiệm của mình","Không vi phạm nếu người đăng cho rằng mình có ý tốt vì lợi ích chung của thôn, dù nội dung gây mâu thuẫn trong cộng đồng, để tránh phát sinh thêm chuyện rắc rối cho thôn"],"e":"Điều 9 khoản 4 nghiêm cấm lợi dụng việc thực hiện dân chủ ở cơ sở để xuyên tạc, vu khống, gây mâu thuẫn, kích động bạo lực; Điều 6 khoản 5 yêu cầu công dân tôn trọng, bảo đảm trật tự, an toàn xã hội và quyền, lợi ích hợp pháp của tổ chức, cá nhân. Quyền phát biểu, phản ánh có giới hạn là không xâm phạm quyền người khác. Cách xử lý cụ thể (nhắc nhở, yêu cầu gỡ, báo cấp xã) là kinh nghiệm theo Cẩm nang.\nVì sao các phương án còn lại chưa đúng: quyền phát biểu không bao gồm vu khống; điều cấm áp dụng với mọi người; ý tốt không biện hộ cho thông tin sai sự thật gây mâu thuẫn.","t":"Tin sai, vu khống, kích động trên nhóm Zalo là hành vi bị cấm: nhắc nhở, yêu cầu gỡ, báo cấp xã khi cần.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"L","y":"NH","r":"NĐ 61/2023/NĐ-CP · Điều 5 khoản 4, Điều 17 khoản 1, 3; NĐ 185/2026/NĐ-CP · Điều 5 khoản 1 điểm c","q":"Quy ước của thôn đã được UBND cấp xã công nhận. Một hộ vi phạm quy ước thì xử lý như thế nào là phù hợp?","o":["Nhắc nhở, vận động, áp dụng các biện pháp đã ghi trong quy ước và được cộng đồng thông qua; việc xử lý theo pháp luật vẫn thuộc cơ quan có thẩm quyền","Trưởng thôn trực tiếp ra quyết định xử phạt hành chính bằng tiền theo mức ghi trong quy ước để bảo đảm tính nghiêm minh của quy ước trước mặt nhiều người để mọi người cùng biết","Quy ước chỉ mang tính khuyến khích, hộ vi phạm không cần nhắc nhở hay chịu bất kỳ biện pháp nào mà cộng đồng đã thống nhất trong quy ước, rồi mọi việc sẽ tự ổn định về sau","Báo ngay cơ quan công an để xử lý hình sự đối với mọi trường hợp vi phạm quy ước, kể cả những lỗi nhỏ trong sinh hoạt hằng ngày và không cần giải thích thêm với bà con trong thôn"],"e":"Hương ước, quy ước do cộng đồng xây dựng (NĐ 185/2026 Điều 5 khoản 1 điểm c) và được UBND cấp xã công nhận; Nghị định 61/2023/NĐ-CP Điều 5 khoản 4 cho phép hương ước, quy ước có các biện pháp thưởng, phạt phù hợp để bảo đảm thực hiện, nhưng không thay thế các biện pháp xử lý theo quy định của pháp luật. Điều 17 giao người dân cử đại diện hộ dự họp và thực hiện nghiêm túc quy ước đã được thông qua, công nhận (khoản 1); khi phát hiện vi phạm có trách nhiệm nhắc nhở, đề nghị chấm dứt hành vi vi phạm, khắc phục hậu quả hoặc phản ánh với Trưởng thôn, tổ chức liên quan (khoản 3). Xử phạt hành chính hay hình sự thuộc cơ quan nhà nước có thẩm quyền.\nVì sao các phương án còn lại chưa đúng: Trưởng thôn không có thẩm quyền xử phạt hành chính; quy ước vẫn có giá trị với cộng đồng; không phải lỗi nào cũng là tội phạm.","t":"Vi phạm quy ước: cộng đồng nhắc nhở, vận động theo quy ước; xử phạt theo pháp luật là việc của cơ quan có thẩm quyền.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-ve-xay-dung-va-thuc-hien-huong-uoc-quy-uoc-cua-cong-dong-dan-cu-119230830100225852.htm"},{"s":"L","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 1 điểm d, g; Điều 6 khoản 2 điểm c","q":"Việc giữ gìn an ninh trật tự, bảo vệ môi trường và giúp đỡ lẫn nhau ở thôn là trách nhiệm của ai?","o":["Của cả cộng đồng: mỗi hộ và mỗi người dân cùng tham gia, Trưởng thôn tổ chức, vận động và phối hợp với các tổ chức đoàn thể","Chỉ của Trưởng thôn và công an viên, còn người dân không có trách nhiệm tham gia vì đã có cán bộ phụ trách các việc này, miễn là không ai phản ứng ngay lúc đó","Chỉ của Ủy ban nhân dân cấp xã, thôn không được tổ chức hay vận động người dân làm những việc này ở khu dân cư mà không cần xin ý kiến ai khác trong cộng đồng","Chỉ của những hộ có đông nhân khẩu hoặc có điều kiện kinh tế khá, các hộ còn lại không phải tham gia các hoạt động này"],"e":"Điều 5 khoản 1 nêu hoạt động tự quản của cộng đồng dân cư gồm cả việc tổ chức giữ gìn an ninh, trật tự, bảo vệ môi trường (điểm d) và các biện pháp khuyến khích tương trợ, giúp đỡ lẫn nhau (điểm g). Điều 6 khoản 2 điểm c giao Trưởng thôn vận động Nhân dân giữ gìn an ninh trật tự, xây dựng đời sống văn hóa. Vì là tự quản của cộng đồng nên mỗi hộ, mỗi người cùng có trách nhiệm.\nVì sao các phương án còn lại chưa đúng: tự quản là việc của cả cộng đồng; không loại trừ hộ nào; thôn được tổ chức và vận động theo Nghị định.","t":"An ninh, môi trường, tương trợ: việc của cả cộng đồng; Trưởng thôn tổ chức, vận động, mỗi hộ cùng làm.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"L","y":"NH","r":"Cẩm nang (kinh nghiệm); NĐ 185/2026/NĐ-CP · Điều 6 khoản 3 điểm a","q":"Đường bê tông do dân đóng góp xây xong, một hộ để vật liệu và cho xe nặng chạy làm hư mặt đường. Cách xử lý nào phù hợp?","o":["Nhắc nhở, giải thích đây là tài sản chung do dân đóng góp, đề nghị khắc phục; đưa việc giữ gìn công trình vào quy ước; vi phạm nặng thì báo UBND cấp xã","Cho phép hộ đó tiếp tục sử dụng như cũ vì đoạn đường nằm ngay trước nhà của họ, không nên nhắc nhở để tránh mất lòng, vì như vậy sẽ nhanh gọn và đỡ tốn thời gian","Đăng ảnh và tên hộ lên nhóm Zalo kèm lời lẽ nặng nề để mọi người cùng lên án, buộc họ phải sửa chữa ngay lập tức và coi như đã xong trách nhiệm của mình, để tránh phát sinh thêm chuyện rắc rối cho thôn","Tự ý chặn lối vào nhà hộ đó bằng vật cản cho đến khi họ sửa xong mặt đường, không cần thông báo hay hỏi ý kiến ai trước mặt nhiều người để mọi người cùng biết"],"e":"Công trình do dân đóng góp là tài sản chung của cộng đồng; Điều 6 khoản 3 điểm a giao Trưởng thôn quyền, trách nhiệm liên quan đến công trình do Nhân dân đóng góp xây dựng. Giữ gìn công trình chung là trách nhiệm của mọi hộ. Cách xử lý (nhắc nhở, đưa vào quy ước, báo cấp xã khi vi phạm nặng) là kinh nghiệm theo Cẩm nang.\nVì sao các phương án còn lại chưa đúng: bỏ qua làm công trình xuống cấp; nêu tên, lăng mạ làm mất đoàn kết và xâm phạm danh dự; tự chặn lối đi xâm phạm quyền của hộ dân.","t":"Giữ gìn công trình chung: nhắc nhở, đưa vào quy ước, báo cấp xã nếu nặng; không nêu tên, không tự chặn lối đi.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"L","y":"NH","r":"Luật 10/2022/QH15 · Điều 5 khoản 2; Điều 6 khoản 2","q":"Khi thôn lấy ý kiến một nội dung bằng họp hoặc phát phiếu, người dân nên làm gì cho đúng?","o":["Tìm hiểu nội dung, tham gia ý kiến trung thực theo hình thức thôn tổ chức; nếu có ý kiến khác thì nêu đúng nơi, đúng lúc","Để người khác quyết thay vì cho rằng dù sao kết quả cuối cùng cũng do Trưởng thôn hoặc cấp trên định đoạt từ trước rồi","Trả lời qua loa cho xong việc vì đã có đại diện khác trong xóm lo thay, bản thân không cần tìm hiểu nội dung lấy ý kiến","Chỉ bàn tán sau lưng, không nêu ý kiến tại cuộc họp hay trên phiếu để tránh mất lòng hàng xóm và những người quen biết, rồi mọi việc sẽ tự ổn định về sau"],"e":"Công dân có quyền đề xuất sáng kiến, tham gia ý kiến, bàn và quyết định (Điều 5 khoản 2) và có nghĩa vụ tham gia ý kiến về các nội dung được lấy ý kiến (Điều 6 khoản 2). Ý kiến thật, nêu đúng lúc giúp cộng đồng quyết định đúng, đồng thời là cơ sở để sau đó mọi người cùng chấp hành.\nVì sao các phương án còn lại chưa đúng: bỏ phiếu hay phát biểu qua loa, ủy mặc người khác hoặc chỉ bàn sau lưng đều làm mất quyền làm chủ của chính mình và khiến quyết định thiếu tiếng nói của dân.","t":"Lấy ý kiến: tìm hiểu, nói thật, nói đúng nơi, đúng lúc; không bàn tán sau lưng.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"L","y":"NH","r":"Luật 10/2022/QH15 · Điều 5, 6, 7","q":"Quyền và nghĩa vụ của người dân trong thực hiện dân chủ ở cơ sở có quan hệ với nhau như thế nào?","o":["Đi đôi với nhau: người dân được biết, bàn, quyết, giám sát và thụ hưởng, đồng thời phải tuân thủ pháp luật, chấp hành quyết định của cộng đồng","Chỉ có quyền, còn nghĩa vụ là việc riêng của chính quyền cấp xã và Trưởng thôn, người dân không phải chịu trách nhiệm nào và không cần giải thích thêm với bà con trong thôn","Chỉ những hộ đã đóng góp đầy đủ mới được hưởng quyền được biết, được bàn và được giám sát các việc chung của thôn, miễn là không ai phản ứng ngay lúc đó","Quyền quyết định tùy theo mức đóng góp, hộ đóng góp nhiều hơn thì có tiếng nói và số phiếu biểu quyết nhiều hơn các hộ khác mà không cần xin ý kiến ai khác trong cộng đồng"],"e":"Luật Thực hiện dân chủ ở cơ sở quy định quyền của công dân (Điều 5), nghĩa vụ của công dân (Điều 6) và quyền thụ hưởng (Điều 7). Quyền và nghĩa vụ gắn với nhau: dân được thông tin, bàn, quyết, giám sát, thụ hưởng thành quả, đồng thời có trách nhiệm tuân thủ pháp luật, chấp hành quyết định của cộng đồng, tôn trọng quyền và lợi ích của người khác.\nVì sao các phương án còn lại chưa đúng: quyền dân chủ không phụ thuộc vào mức đóng góp; mỗi hộ là một đại diện, mỗi người là một tiếng nói; nghĩa vụ thuộc về chính người dân chứ không chỉ chính quyền.","t":"Quyền và nghĩa vụ đi đôi: dân được biết, bàn, quyết, giám sát, thụ hưởng; cũng phải tuân thủ pháp luật, chấp hành quyết định chung.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"}]};
