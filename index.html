<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tìm hiểu hoạt động thôn, tổ dân phố</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E7A55">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#EEF4FB;--card:#FFFFFF;--card2:#F4F6FA;--line:#DCE2EB;--ink:#15202E;--muted:#5B6B7E;

--ok:#157A47;--ok-bg:#E2F5EA;--bad:#C0281F;--bad-bg:#FDE9E7;--blue:#2F6FDE;--band:#1F4E86;--cream:#D3E4F7;--shadow:0 6px 24px rgba(21,32,46,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1420;--card:#162131;--card2:#1C2A3D;--line:#2B3B52;--ink:#EAF0F8;--muted:#9DB0C6;
--red:#5B9BE0;--red-h:#4A86C8;--red-bg:#14283F;--gold:#F5C547;--gold-h:#E2B23A;--gold-ink:#2B1F00;--gold-bg:#3A3010;--gold-tx:#F5D77A;
--ok:#5FD39A;--ok-bg:#123626;--bad:#FF8A80;--bad-bg:#40191A;--blue:#6AA2FF;--band:#0B2036;--cream:#C9DFF7;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0D1420;--card:#162131;--card2:#1C2A3D;--line:#2B3B52;--ink:#EAF0F8;--muted:#9DB0C6;
--red:#5B9BE0;--red-h:#4A86C8;--red-bg:#14283F;--gold:#F5C547;--gold-h:#E2B23A;--gold-ink:#2B1F00;--gold-bg:#3A3010;--gold-tx:#F5D77A;
--ok:#5FD39A;--ok-bg:#123626;--bad:#FF8A80;--bad-bg:#40191A;--blue:#6AA2FF;--band:#0B2036;--cream:#C9DFF7;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.banner{position:relative;background:var(--band)}
.banner img{display:block;width:100%;height:max(23.6vw,min(42vh,33.7vw));object-fit:cover;object-position:top}
.credit{background:var(--band);color:var(--cream);text-align:center;padding:10px max(16px,env(safe-area-inset-left));font-size:13px;line-height:1.45;letter-spacing:.02em;border-top:3px solid var(--gold)}
.credit b{color:#fff;font-weight:700}
.credit span{display:block}
@media(min-width:760px){.credit span{display:inline}.credit span+span:before{content:"  ·  "}}
.tbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow)}
.banner .tbtn.snd{right:calc(max(10px,env(safe-area-inset-right)) + 48px)}
.banner .tbtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));background:rgba(255,255,255,.85);color:#222;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.hero{margin-top:-1px;padding:26px 0 8px}
h1{font-size:clamp(22px,4.6vw,34px);line-height:1.2;margin:0 0 6px;color:var(--red);letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:4px solid var(--gold)}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--red)}
.stat small{color:var(--muted)}
.modes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:16px}
@media(min-width:700px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:block;width:100%}
.mode.on{border-color:var(--red);background:var(--red-bg)}
.mode h3{margin:0 0 4px;font-size:17px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.go{display:block;width:100%;background:var(--gold);color:var(--gold-ink);border:0;border-radius:14px;padding:15px 20px;font-size:18px;font-weight:800;box-shadow:0 6px 0 var(--gold-h);transition:transform .08s,box-shadow .08s}
.go:hover{background:var(--gold-h)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-h)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-h);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.best{margin:12px 0 0;text-align:center;color:var(--muted);font-size:14px}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.refs{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.refs li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}

.ladder{margin:22px 0 40px}
.ladder h2,.sec-t{font-size:18px;margin:0 0 10px}
.lad{display:grid;gap:8px}
.lad div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}

/* quiz */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;padding-top:max(10px,env(safe-area-inset-top))}
.bar .wrap{display:flex;align-items:center;gap:10px}

.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:99px;transition:width .3s}
.qlay{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:18px 0 24px}
@media(min-width:900px){.qlay{grid-template-columns:minmax(0,1fr) 280px;align-items:start}.side{position:sticky;top:76px}}
.qtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.tag.red{background:var(--red-bg);color:var(--red);border-color:transparent}
.qtext{font-size:clamp(17px,2.4vw,20px);font-weight:700;line-height:1.4;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--red)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--red);background:var(--red-bg)}
.opt.sel .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.exp{margin-top:14px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--card2);font-size:15px}
.exp.ok{background:var(--ok-bg);border-color:var(--ok)}
.exp.bad{background:var(--bad-bg);border-color:var(--bad)}
.exp h4{margin:0 0 6px;font-size:15px}.exp p{margin:0 0 8px;line-height:1.6}.exp p:last-child{margin-bottom:0}.exp p.why{opacity:.82;font-size:14px;border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}.exp p.pk{font-size:14px}
.exp.ok h4{color:var(--ok)}.exp.bad h4{color:var(--bad)}
.tip{margin-top:10px;background:var(--gold-bg);color:var(--gold-tx);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}

.nav{position:sticky;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.nav .wrap{display:flex;gap:10px}
.nav .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gn{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;padding:0;position:relative}
.gn.cur{outline:3px solid var(--gold)}
.gn.done{background:var(--red);border-color:var(--red);color:#fff}
.gn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.gn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.gn.fl:after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:13px;color:var(--gold)}
.legend{font-size:12px;color:var(--muted);margin-top:10px}
.flagb{font-size:13px;padding:6px 12px;border-radius:99px}
.flagb.on{background:var(--gold-bg);border-color:var(--gold);color:var(--gold-tx)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{max-width:420px;width:100%}
.ov h3{margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1}
/* result */
.rtop{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center;text-align:center}
@media(min-width:760px){.rtop{grid-template-columns:200px minmax(0,1fr);text-align:left}}
.ring{position:relative;width:180px;height:180px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--line);stroke-width:12}
.ring .fg{fill:none;stroke:var(--red);stroke-width:12;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:40px;line-height:1;color:var(--red)}
.ring .num small{color:var(--muted)}
.gb{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:99px;padding:4px 16px;font-size:18px;margin-bottom:6px}
.rstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
@media(min-width:700px){.rstats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.rs b{display:block;font-size:24px}
.rs.ok b{color:var(--ok)}.rs.bad b{color:var(--bad)}
.rs small{color:var(--muted)}
.comments{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0 0 16px}
.comments p{margin:0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}
.meters{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.meter-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:4px}
.meter-top span{color:var(--muted)}
.mbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s ease}
.gbars{display:grid;gap:16px}
.gbr .gbt{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.gbt b{flex:1;min-width:0;font-size:15px;line-height:1.25}
.gv{color:var(--muted);font-size:14px;white-space:nowrap}
.gtr{position:relative;height:22px;border-radius:99px;background:var(--line);overflow:hidden}
.gtr i{display:block;height:100%;width:0;border-radius:99px;transition:width .9s ease}
.gbf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;min-height:20px}
.glv{font-size:13px;font-weight:700}
.l-hi .glv{color:var(--ok)}.l-mid .glv{color:#B7791F}.l-lo .glv{color:var(--bad)}
.l-hi i{background:var(--ok)}.l-mid i{background:var(--gold)}.l-lo i{background:var(--bad)}
.recall{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0;padding:0;list-style:none}
.recall li{background:var(--gold-bg);color:var(--gold-tx);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:14px}
.sec{margin-top:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:99px;padding:6px 14px;font-size:14px;border:1px solid var(--line);background:var(--card)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.rv{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rv .card{padding:16px}
.rv .opt{cursor:default;padding:8px 12px}
.rv .opt:hover{border-color:var(--line)}
.rv .opt.ok:hover{border-color:var(--ok)}.rv .opt.bad:hover{border-color:var(--bad)}
.acts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:18px 0 40px}
@media(min-width:700px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.btn.sm{padding:8px 14px;font-size:14px}
.privacy{margin:10px 0 0;text-align:center;color:var(--muted);font-size:13px}
.bigstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
@media(min-width:700px){.bigstat{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hq{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.hq li{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.hq b{color:var(--red)}
.hb{background:linear-gradient(135deg,#0B4F39,#0E7A55 55%,#0A5C40);padding:46px 16px 38px;text-align:center;color:#fff}.hbi small{display:block;letter-spacing:.08em;font-weight:700;color:#F5C547;font-size:13px}.hbi strong{display:block;font-size:clamp(28px,6vw,52px);font-weight:900;line-height:1.1;margin:10px 0}.hbi em{font-style:normal;color:#CFEFE0;font-size:15px}
.exp a,.refs a{color:var(--blue);font-weight:600}
.tag.lnk{text-decoration:none;cursor:pointer;border-color:var(--blue);color:var(--blue)}.tag.red.lnk{background:var(--red-bg);color:var(--red);border-color:transparent}.tag.lnk:hover{text-decoration:underline}
.note{padding:14px 16px;background:var(--gold-bg);color:var(--gold-tx);border-radius:12px;margin:20px 0;font-size:15px}
#boot{padding:24px;margin:24px auto;max-width:560px;background:var(--gold-bg);color:var(--gold-tx);border-radius:12px;font-size:15px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.dash{margin:14px 0}.dl{display:flex;justify-content:space-between;gap:8px;font-size:16px;margin-bottom:6px}.dl span{color:var(--muted)}
.cta{display:grid;gap:10px;margin-top:14px}@media(min-width:700px){.cta{grid-template-columns:1.4fr 1fr}}
.mh{font-size:19px;margin:20px 0 10px}.mods{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);margin-bottom:16px}
@media(min-width:700px){.mods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.modc{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
.modc:hover{border-color:var(--red)}.mi{font-size:30px}.mt{flex:1;min-width:0}.mt b{display:block;font-size:16px}.mt small{display:block;color:var(--muted);margin:2px 0 6px}
.bdg{display:inline-block;margin-left:6px;font-weight:700;color:var(--red)}
.qtext{font-size:clamp(19px,5vw,23px)!important;line-height:1.45}.opt .tx{font-size:clamp(16px,4.2vw,18px)}
</style>
<style>
.pg{max-width:640px}
[data-act=home].tbtn{width:42px!important;height:42px!important;color:var(--red);border:2px solid var(--red)!important;flex:none}[data-act=home].tbtn svg{display:block}
.bar{padding:6px 0!important;padding-top:max(6px,env(safe-area-inset-top))!important}.bar .wrap{gap:7px!important}.bar .tbtn{width:36px;height:36px;font-size:16px;flex:none}.bar .t1{font-size:12px;white-space:nowrap}.bar .prog{height:6px;margin-top:3px}.bar .btn{padding:7px 12px!important;font-size:14px}
.nav{padding:6px 0!important;padding-bottom:max(6px,env(safe-area-inset-bottom))!important}.nav .btn{padding:11px 10px}
.tabs.cpt{padding-top:0}.tabs.cpt button{flex-direction:row;justify-content:center;gap:6px;font-size:14px;padding:8px 0;border-top-width:2px}.tabs.cpt .ic{font-size:17px}

.card.main{padding:14px}.qtags{margin-bottom:8px!important;flex-wrap:nowrap!important;overflow:hidden}.qtags .tag{font-size:11px;padding:2px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qtext{font-size:clamp(18px,4.6vw,21px)!important;line-height:1.38!important;margin-bottom:10px!important}.opt .tx{font-size:clamp(15px,4vw,17px)!important}.opt{padding:10px 12px!important}.opts{gap:8px!important}
@media(max-height:800px){.qtags .tag:not(.red){display:none}}
.hbox{background:linear-gradient(135deg,#2E6DB4,#1F4E86);border-radius:24px;padding:28px 10px;margin:max(14px,env(safe-area-inset-top)) 0 12px;box-shadow:0 6px 18px rgba(31,78,134,.28)}.hbox h1{color:#fff;text-transform:uppercase;text-align:center;font-size:clamp(18px,5.8vw,28px);line-height:1.35;letter-spacing:.01em;font-weight:800;margin:0;text-wrap:balance}.grow{display:flex;align-items:center;gap:10px;margin:0 0 14px}.grow .gr{flex:1;font-size:18px;font-weight:700;color:var(--ink);margin:0}.grow .tbtn{flex:none}.hb2{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 0 4px}.hb2 .mtitle{padding:0;font-size:22px;flex:1}
:root{--tabh:0px}body:has(.tabs){--tabh:calc(72px + env(safe-area-inset-bottom))}body{padding-bottom:var(--tabh)}.nav{bottom:var(--tabh)!important}.topb h1{text-wrap:balance}.lk2{background:none;border:0;color:var(--red);font-size:14px;text-decoration:underline;padding:2px 0;text-align:left}
.topb{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(16px,env(safe-area-inset-top)) 0 12px}
.topb h1{font-size:clamp(19px,5.2vw,23px);line-height:1.25;margin:0;color:var(--ink);letter-spacing:0}.gr{color:var(--muted);font-size:16px;margin-top:2px}
.av{width:46px;height:46px;border-radius:50%;border:2px solid var(--red);background:var(--red-bg);color:var(--red);font-weight:800;font-size:20px;flex:none;display:grid;place-items:center}
.gban{background:linear-gradient(90deg,#3E7BD0,#33B38D);color:#fff;font-weight:800;font-size:clamp(20px,5.5vw,24px);text-align:center;border-radius:14px;padding:16px 12px;margin:4px 0 14px;box-shadow:var(--shadow)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}

huc-hien-dan-chu-o-co-so-119221212165541651.htm"],["NGHỊ ĐỊNH SỐ 59/2023/NĐ-CP NGÀY 14/8/2023","Quy định chi tiết một số điều của Luật Thực hiện dân chủ ở cơ sở","https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-so-59-2023-nd-cp-quy-dinh-chi-tiet-mot-so-dieu-cua-luat-thuc-hien-dan-chu-o-co-so-119230820172027752.htm"],["LUẬT SỐ 31/2024/QH15 NGÀY 18/01/2024","Luật Đất đai (có hiệu lực từ 01/8/2024). Theo báo chí ngày 17/11/2026, Ủy ban Thường vụ Quốc hội đã thống nhất trình Quốc hội dự án Luật Đất đai (sửa đổi); dự án chưa được thông qua, cần theo dõi khi áp dụng","https://xaydungchinhsach.chinhphu.vn/toan-van-luat-dat-dai-119240221224513596.htm"],["NGHỊ ĐỊNH SỐ 61/2023/NĐ-CP NGÀY 16/8/2023","Về xây dựng và thực hiện hương ước, quy ước của cộng đồng dân cư","https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-ve-xay-dung-va-thuc-hien-huong-uoc-quy-uoc-cua-cong-dong-dan-cu-119230830100225852.htm"]],"BANK":[{"s":"A","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 2 khoản 2, 3","q":"Theo Nghị định 185/2026/NĐ-CP, thôn và tổ dân phố là gì?","o":["Tổ chức tự quản của cộng đồng dân cư, đặt ở cấp xã, không phải cấp hành chính","Một cấp hành chính cơ sở nằm dưới cấp xã, có bộ máy điều hành riêng của nhà nước","Cơ quan chuyên môn thuộc Ủy ban nhân dân cấp xã, hoạt động theo chỉ đạo trực tiếp","Đơn vị hành chính có con dấu, ngân sách và bộ máy riêng như một cấp chính quyền"],"e":"Thôn (khu vực nông thôn) và tổ dân phố (khu vực đô thị) là nơi người dân tự quản việc chung của cộng đồng và phối hợp với chính quyền cấp xã. Đây không phải là một tầng trong bộ máy nhà nước.\nHiểu đúng điều này giúp Trưởng thôn không bị coi là \"cán bộ nhà nước cấp thôn\", không phải giải quyết thủ tục hành chính thay Ủy ban nhân dân cấp xã, và tránh xu hướng \"hành chính hóa\" thôn, tổ dân phố.\nVì sao các phương án còn lại chưa đúng: thôn không phải cấp hành chính; không phải cơ quan chuyên môn của xã; không có con dấu và ngân sách của một đơn vị hành chính.","t":"Thôn, tổ dân phố là tự quản của cộng đồng, không phải một cấp hành chính.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"A","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 9","q":"Theo Nghị định 185/2026/NĐ-CP, cơ quan nào quyết định thành lập, sắp xếp, tổ chức lại, giải thể, đặt tên, đổi tên thôn, tổ dân phố?","o":["Hội đồng nhân dân cấp xã","Ủy ban nhân dân cấp xã","Hội đồng nhân dân cấp tỉnh","Chủ tịch Ủy ban nhân dân cấp tỉnh"],"e":"Theo Điều 9, đây là thẩm quyền của Hội đồng nhân dân cấp xã. Riêng đặc khu không tổ chức cấp chính quyền địa phương thì do Ủy ban nhân dân đặc khu quyết định.\nTrong mô hình chính quyền địa phương hai cấp (tỉnh và xã), không còn cấp huyện ở giữa, nên việc sắp xếp thôn, tổ dân phố được quyết định ngay tại cấp xã.\nVì sao các phương án còn lại chưa đúng: UBND cấp xã là cơ quan chấp hành, trình và tổ chức thực hiện; cấp tỉnh không quyết định từng thôn, tổ dân phố.","t":"Sắp xếp thôn, tổ dân phố: HĐND cấp xã quyết định.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"A","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 2 khoản 4, Điều 10 khoản 2","q":"Trường hợp cần thiết do đặc điểm lịch sử, văn hóa, dân tộc, phong tục, tập quán, thì việc tổ chức và sử dụng tên gọi thôn, tổ dân phố do cơ quan nào quyết định?","o":["Hội đồng nhân dân cấp xã quyết định, phù hợp thực tiễn địa phương","Chính phủ xem xét và quyết định riêng cho từng thôn, tổ dân phố có đề nghị","Ủy ban nhân dân cấp tỉnh quyết định sau khi lấy ý kiến của các sở, ngành","Trưởng thôn tự quyết định sau khi họp bàn với Ban Công tác Mặt trận thôn"],"e":"Điều 2 khoản 4 giao Hội đồng nhân dân cấp xã quyết định việc tổ chức và sử dụng tên gọi: thôn, xóm, làng, ấp, bản, buôn, bon, phum, sóc, tổ dân phố, khu phố, khối phố, khóm, tiểu khu hoặc tên gọi cộng đồng dân cư khác phù hợp thực tiễn. Khi đó vẫn áp dụng tiêu chuẩn quy mô số hộ tương ứng với loại hình thôn hoặc tổ dân phố (Điều 10 khoản 2).\nCách làm này tôn trọng văn hóa địa phương mà vẫn thống nhất về tổ chức tự quản.\nVì sao các phương án còn lại chưa đúng: Nghị định giao quyền này cho Hội đồng nhân dân cấp xã, không phải Chính phủ, Ủy ban nhân dân cấp tỉnh hay Trưởng thôn.","t":"Tên gọi thôn, tổ dân phố do HĐND cấp xã quyết định.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"B","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 14 khoản 1","q":"Người hoạt động không chuyên trách ở thôn, tổ dân phố gồm những chức danh nào?","o":["Bí thư Chi bộ; Trưởng thôn hoặc Tổ trưởng; Trưởng Ban Công tác Mặt trận","Bí thư Chi bộ; Trưởng thôn hoặc Tổ trưởng; Phó thôn hoặc Phó tổ trưởng","Trưởng thôn hoặc Tổ trưởng; Công an viên; Trưởng Ban Công tác Mặt trận","Trưởng thôn hoặc Tổ trưởng; Phó thôn; Tổ trưởng tổ liên gia, tổ hòa giải"],"e":"Nghị định quy định thống nhất 03 chức danh: Bí thư Chi bộ, Trưởng thôn hoặc Tổ trưởng tổ dân phố, và Trưởng Ban Công tác Mặt trận.\nĐây là những người được hưởng quỹ khoán phụ cấp theo Điều 15. Cách quy định gọn 3 chức danh nhằm tinh gọn đội ngũ và dồn thu nhập cho những vị trí then chốt.\nVì sao các phương án còn lại chưa đúng: Phó thôn, Công an viên, Tổ trưởng tổ liên gia không nằm trong 3 chức danh này.","t":"3 chức danh: Bí thư Chi bộ, Trưởng thôn/Tổ trưởng, Trưởng Ban CTMT.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"B","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 14 khoản 2","q":"Mỗi thôn, tổ dân phố có tối đa bao nhiêu người hoạt động không chuyên trách?","o":["Không quá 03 người","Không quá 02 người","Không quá 05 người","Không giới hạn, tùy địa phương"],"e":"Mỗi thôn, tổ dân phố có không quá 03 người, ứng với 03 chức danh ở câu trước.\nCon số này áp dụng chung, không tăng theo quy mô số hộ. Quy mô lớn hơn chỉ ảnh hưởng đến mức khoán phụ cấp, không làm tăng số người.\nVì sao các phương án còn lại chưa đúng: 2, 5 hay không giới hạn đều không đúng với quy định.","t":"Tối đa 03 người cho mỗi thôn, tổ dân phố.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"B","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 7 khoản 1","q":"Người được bầu làm Trưởng thôn, Tổ trưởng tổ dân phố phải từ đủ bao nhiêu tuổi?","o":["Từ đủ 21 tuổi","Từ đủ 18 tuổi","Từ đủ 25 tuổi","Từ đủ 30 tuổi"],"e":"Tiêu chuẩn đầu tiên: là công dân Việt Nam, cư trú thường xuyên tại địa bàn xã, phường, đặc khu, từ đủ 21 tuổi trở lên, ưu tiên người trong độ tuổi lao động và đủ sức khỏe.\nCó tất cả 05 tiêu chuẩn: tuổi và cư trú; đạo đức, uy tín; năng lực tổ chức, vận động; ứng dụng công nghệ thông tin và kỹ năng báo cáo; không thuộc các trường hợp bị kỷ luật, truy cứu trách nhiệm hình sự, đang chấp hành bản án.\nVì sao các phương án còn lại chưa đúng: 18 tuổi là tuổi công dân đủ quyền bầu cử; 25 và 30 tuổi không phải điều kiện của chức danh này.","t":"Trưởng thôn: từ đủ 21 tuổi, cư trú thường xuyên tại địa bàn.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"B","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 7 khoản 3, 5","q":"Trường hợp nào dưới đây KHÔNG đủ tiêu chuẩn làm Trưởng thôn, Tổ trưởng tổ dân phố?","o":["Người đang trong thời gian bị xử lý kỷ luật","Người 45 tuổi, đủ sức khỏe, có uy tín trong thôn","Người chưa có bằng đại học nhưng có kinh nghiệm tổ chức Nhân dân","Người chưa từng làm cán bộ nhưng biết dùng điện thoại thông minh để báo cáo"],"e":"Một trong 05 tiêu chuẩn là không thuộc các trường hợp đang bị xử lý kỷ luật, bị truy cứu trách nhiệm hình sự hoặc đang chấp hành bản án, quyết định của Tòa án.\nNghị định đòi hỏi kiến thức văn hóa, năng lực và kinh nghiệm tổ chức tự quản, chứ không đòi bằng đại học. Kinh nghiệm cán bộ cũng không bắt buộc.\nVì sao các phương án còn lại chưa đúng: ba người còn lại đều có thể đáp ứng các tiêu chuẩn về tuổi, uy tín, năng lực và kỹ năng.","t":"Đang bị kỷ luật hoặc truy cứu trách nhiệm hình sự thì không đủ tiêu chuẩn.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"B","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 10 khoản 1 điểm đ","q":"Quy mô số hộ tối thiểu để thành lập thôn, tổ dân phố ở vùng Duyên hải Nam Trung Bộ và Tây Nguyên là bao nhiêu?","o":["Thôn từ 300 hộ, tổ dân phố từ 450 hộ","Thôn từ 150 hộ, tổ dân phố từ 300 hộ","Thôn từ 400 hộ, tổ dân phố từ 550 hộ","Thôn từ 500 hộ, tổ dân phố từ 700 hộ"],"e":"Với vùng Duyên hải Nam Trung Bộ và Tây Nguyên, thôn tối thiểu 300 hộ và tổ dân phố tối thiểu 450 hộ.\nNghị định chia hai thành phố lớn và sáu vùng kinh tế - xã hội; vùng nào đông dân, dễ đi lại thì yêu cầu số hộ cao hơn.\nVì sao các phương án còn lại chưa đúng: 150/300 là mức của Trung du và miền núi phía Bắc; 400/550 là của Đồng bằng sông Hồng, Đông Nam Bộ, Đồng bằng sông Cửu Long; 500/700 là của Hà Nội và TP. Hồ Chí Minh.","t":"Tây Nguyên và Duyên hải NTB: thôn 300 hộ, tổ dân phố 450 hộ.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"B","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 15 khoản 1 điểm a","q":"Thôn nào được hưởng mức khoán phụ cấp 8,0 lần mức lương cơ sở?","o":["Thôn từ 700 hộ trở lên","Thôn từ 400 hộ trở lên","Mọi thôn thuộc vùng Tây Nguyên","Thôn có từ 3 chức danh trở lên"],"e":"Điều 15 khoản 1 điểm a: mức 8,0 lần mức lương cơ sở áp dụng cho thôn từ 700 hộ gia đình trở lên; tổ dân phố từ 1.000 hộ trở lên; thôn, tổ dân phố thuộc đơn vị hành chính cấp xã trọng điểm về quốc phòng theo quyết định của cơ quan có thẩm quyền; thôn, tổ dân phố thuộc xã ở khu vực biên giới, hải đảo; thôn đặc biệt khó khăn.\nĐây là quỹ phụ cấp ngân sách nhà nước khoán, đã bao gồm hỗ trợ đóng bảo hiểm xã hội.\nVì sao các phương án còn lại chưa đúng: 400 hộ chưa đạt ngưỡng 700 hộ; vùng Tây Nguyên không tự động có mức 8,0 lần; số chức danh (tối đa 3) không quyết định mức khoán.","t":"Khoán 8,0 lần: thôn từ 700 hộ, tổ dân phố từ 1.000 hộ, hoặc địa bàn đặc thù.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"B","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 15 khoản 1 điểm b, khoản 3","q":"Một thôn 450 hộ, không thuộc diện đặc biệt khó khăn, biên giới hay hải đảo. Quỹ khoán phụ cấp ba chức danh là bao nhiêu?","o":["6,5 lần mức lương cơ sở, đã gồm hỗ trợ đóng bảo hiểm xã hội","8,0 lần mức lương cơ sở, đã gồm hỗ trợ đóng bảo hiểm xã hội","4,5 lần mức lương cơ sở, đã gồm hỗ trợ đóng bảo hiểm xã hội","6,5 lần mức lương cơ sở, chưa gồm hỗ trợ đóng bảo hiểm xã hội"],"e":"Thôn này không thuộc nhóm 8,0 lần nên theo Điều 15 khoản 1 điểm b được khoán quỹ phụ cấp 6,5 lần mức lương cơ sở, đã bao gồm hỗ trợ đóng bảo hiểm xã hội. Khoản 3: nếu tỉnh dùng ngân sách địa phương để quy định mức khoán cao hơn thì Hội đồng nhân dân cấp tỉnh quyết định mức cụ thể phù hợp khả năng cân đối ngân sách.\nVì sao các phương án còn lại chưa đúng: 8,0 lần chỉ cho nhóm đủ điều kiện; 4,5 lần là mức cũ, không còn ghi trong văn bản này; và quỹ khoán đã bao gồm, không phải chưa bao gồm, hỗ trợ bảo hiểm xã hội.","t":"Thôn còn lại: 6,5 lần, đã gồm hỗ trợ BHXH. Tỉnh có thể khoán cao hơn.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"B","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 4 khoản 3","q":"Nhiệm kỳ của Trưởng thôn, Tổ trưởng tổ dân phố là bao lâu?","o":["05 năm","02 năm 06 tháng","03 năm","04 năm"],"e":"Điều 4 khoản 3: nhiệm kỳ của Trưởng thôn, Tổ trưởng tổ dân phố là 05 năm. Khi cần bảo đảm thống nhất thời điểm tổ chức lại thôn, tổ dân phố, hoặc khi gặp tình huống bất khả kháng như thiên tai, dịch bệnh không thể bầu đúng thời hạn, Ủy ban nhân dân cấp xã quyết định rút ngắn hoặc kéo dài nhiệm kỳ nhưng không quá 06 tháng. Nếu phải rút ngắn hoặc kéo dài quá 06 tháng thì Ủy ban nhân dân cấp xã báo cáo Ủy ban nhân dân cấp tỉnh xem xét, quyết định.\nVì sao các phương án còn lại chưa đúng: 2 năm 6 tháng, 3 năm và 4 năm đều không phải nhiệm kỳ theo Nghị định này.","t":"Nhiệm kỳ 05 năm; điều chỉnh không quá 06 tháng do UBND cấp xã quyết định.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"B","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 4 khoản 2","q":"Khi thôn khuyết Trưởng thôn hoặc đang trong quá trình sắp xếp, tổ chức lại, ai chỉ định người điều hành lâm thời và trong bao lâu?","o":["Ủy ban nhân dân cấp xã chỉ định Trưởng thôn lâm thời, tối đa 06 tháng kể từ ngày chỉ định","Hội đồng nhân dân cấp xã chỉ định Trưởng thôn lâm thời, nhiệm kỳ tối đa 12 tháng","Bí thư Chi bộ đương nhiên điều hành thôn, cho đến khi cấp trên có chỉ đạo khác, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Ủy ban nhân dân cấp tỉnh chỉ định Trưởng thôn lâm thời, tối đa 03 tháng mà không cần hỏi ý kiến thêm của người dân"],"e":"Điều 4 khoản 2: trường hợp thành lập, sắp xếp, tổ chức lại thôn, tổ dân phố, hoặc khuyết Trưởng thôn, Tổ trưởng tổ dân phố thì Ủy ban nhân dân cấp xã chỉ định người lâm thời điều hành cho đến khi bầu được người mới, trong thời hạn không quá 06 tháng kể từ ngày có quyết định chỉ định.\nQuy định giúp hoạt động của thôn không bị gián đoạn, nhưng người lâm thời chỉ là giải pháp tạm thời, phải sớm tổ chức bầu theo Luật Thực hiện dân chủ ở cơ sở và Nghị định 59/2023.\nVì sao các phương án còn lại chưa đúng: không phải Hội đồng nhân dân cấp xã hay Ủy ban nhân dân cấp tỉnh chỉ định; 12 tháng hay 3 tháng không đúng; Bí thư Chi bộ không đương nhiên điều hành.","t":"Khuyết Trưởng thôn: UBND cấp xã chỉ định lâm thời, tối đa 06 tháng.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"B","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 6 khoản 3 điểm c","q":"Ngoài Trưởng thôn, những người tham gia hoạt động ở thôn (nếu có) được lựa chọn và công nhận như thế nào?","o":["Trưởng thôn chọn sau khi thống nhất với Bí thư Chi bộ, Trưởng Ban Công tác Mặt trận; UBND cấp xã công nhận","Do cộng đồng dân cư bầu tại cuộc họp thôn, khi có trên 50% tổng số đại diện hộ gia đình tán thành","Do Chủ tịch Ủy ban nhân dân cấp tỉnh chỉ định theo đề nghị của Sở Nội vụ và không phải giải thích thêm cho các hộ trong thôn","Do Bí thư Chi bộ tự quyết định, báo cáo Ủy ban nhân dân cấp xã để biết, miễn là công trình kịp hoàn thành đúng kế hoạch"],"e":"Điều 6 khoản 3 điểm c: căn cứ quy định của Hội đồng nhân dân cấp tỉnh về số lượng, chức danh người tham gia hoạt động ở thôn, Trưởng thôn lựa chọn người tham gia hoạt động sau khi thống nhất với Bí thư Chi bộ và Trưởng Ban Công tác Mặt trận. Ủy ban nhân dân cấp xã quyết định công nhận và cho thôi làm người tham gia hoạt động ở thôn. Điều 4 khoản 1 nói rõ Hội đồng nhân dân cấp tỉnh quyết định việc bố trí các chức danh hỗ trợ Trưởng thôn.\nPhần \"bầu\" bằng biểu quyết của cộng đồng chỉ áp dụng cho Trưởng thôn, Tổ trưởng và các thành viên Ban Thanh tra nhân dân, Ban Giám sát đầu tư của cộng đồng.\nVì sao các phương án còn lại chưa đúng: cộng đồng không bầu những người hỗ trợ này; cấp tỉnh không chỉ định trực tiếp; và Trưởng thôn phải thống nhất với Bí thư Chi bộ, Trưởng Ban Công tác Mặt trận.","t":"Người hỗ trợ Trưởng thôn: Trưởng thôn chọn (sau khi thống nhất), UBND cấp xã công nhận.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"C","y":"NH","r":"Luật 10/2022/QH15 · Điều 15","q":"Việc nào dưới đây thuộc nội dung Nhân dân ở thôn trực tiếp bàn và quyết định?","o":["Bầu, cho thôi làm Trưởng thôn, Tổ trưởng tổ dân phố","Phê duyệt quy hoạch sử dụng đất của xã","Quyết định dự toán ngân sách của xã, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Quyết định thu hồi đất để làm đường mà không cần hỏi ý kiến thêm của người dân"],"e":"Điều 15 liệt kê 06 nội dung Nhân dân bàn và quyết định: (1) chủ trương và mức đóng góp xây dựng cơ sở hạ tầng, công trình công cộng; (2) thu, chi, quản lý các khoản đóng góp và nguồn tài trợ; (3) hương ước, quy ước; (4) bầu, cho thôi làm Trưởng thôn, Tổ trưởng; (5) bầu, cho thôi làm thành viên Ban Thanh tra nhân dân, Ban Giám sát đầu tư của cộng đồng; (6) công việc tự quản khác không trái pháp luật.\nVì sao các phương án còn lại chưa đúng: quy hoạch, dự toán ngân sách và thu hồi đất thuộc thẩm quyền của cơ quan nhà nước; Nhân dân được công khai, tham gia ý kiến, giám sát chứ không biểu quyết thay.","t":"Dân quyết: đóng góp, quỹ, hương ước, bầu Trưởng thôn, bầu các ban, việc tự quản.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"C","y":"NH","r":"Luật 10/2022/QH15 · Điều 15 khoản 5; NĐ 185/2026/NĐ-CP · Điều 5 khoản 1 điểm đ","q":"Thành viên Ban Giám sát đầu tư của cộng đồng ở thôn do ai bầu?","o":["Cộng đồng dân cư, bầu tại cuộc họp","Chủ tịch Ủy ban nhân dân cấp xã chỉ định","Trưởng thôn tự chọn","Hội đồng nhân dân cấp xã cử"],"e":"Việc bầu, cho thôi làm thành viên Ban Thanh tra nhân dân và Ban Giám sát đầu tư của cộng đồng là nội dung Nhân dân bàn và quyết định (Luật 10/2022, Điều 15 khoản 5); Nghị định 185/2026, Điều 5 khoản 1 điểm đ, xếp đây vào hoạt động tự quản của thôn. Vì vậy thành viên do cộng đồng dân cư bầu tại cuộc họp.\nVì sao các phương án còn lại chưa đúng: UBND cấp xã, HĐND cấp xã hay Trưởng thôn đều không được chỉ định thay cộng đồng.","t":"Ban Giám sát đầu tư của cộng đồng do dân bầu, không do cấp trên chỉ định.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"C","y":"NH","r":"Luật 10/2022/QH15 · Điều 16","q":"Công dân đề xuất một nội dung để Nhân dân bàn, quyết định thì cần bao nhiêu hộ đồng thuận?","o":["Từ 10% tổng số hộ gia đình","Từ 5% tổng số hộ gia đình","Từ 30% tổng số hộ gia đình","Trên 50% tổng số hộ gia đình"],"e":"Sáng kiến của công dân cần ít nhất 10% tổng số hộ gia đình trong thôn, tổ dân phố đồng thuận. Nếu dưới 10% nhưng Ban Công tác Mặt trận thấy có lợi cho cộng đồng thì Trưởng thôn vẫn có thể đưa ra bàn.\nTrưởng thôn cần nhớ: 10% chỉ là ngưỡng để được đưa ra họp, còn việc thông qua phải đạt tỷ lệ ở Điều 21.\nVì sao các phương án còn lại chưa đúng: 5% quá thấp, 30% và 50% cao hơn quy định; trên 50% là một ngưỡng biểu quyết, không phải ngưỡng đề xuất.","t":"Đề xuất của công dân: từ 10% tổng số hộ. Biểu quyết: theo Điều 21.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"C","y":"NH","r":"Luật 10/2022/QH15 · Điều 16","q":"Ý kiến đồng thuận của các hộ trong sáng kiến của công dân có giá trị trong bao lâu?","o":["03 tháng kể từ ngày bày tỏ","01 tháng kể từ ngày bày tỏ","06 tháng kể từ ngày bày tỏ","12 tháng kể từ ngày bày tỏ"],"e":"Sự đồng thuận của các hộ có giá trị trong 03 tháng kể từ ngày bày tỏ. Công dân đề xuất phải chịu trách nhiệm về tính chính xác của số lượng và danh sách hộ đồng thuận.\nQuy định này tránh tình trạng sáng kiến bị trì hoãn quá lâu đến mức ý kiến của các hộ không còn phản ánh thực tế.\nVì sao các phương án còn lại chưa đúng: 1, 6 và 12 tháng không đúng với quy định.","t":"Sáng kiến công dân: 10% hộ, giá trị 03 tháng.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"C","y":"NH","r":"Cẩm nang · phần giới thiệu Luật 10/2022/QH15","q":"So với Pháp lệnh trước đây, Luật 10/2022 bổ sung yếu tố nào vào phương châm \"Dân biết, dân bàn, dân làm, dân kiểm tra, dân giám sát…\"?","o":["\"Dân thụ hưởng\"","\"Dân bầu\"","\"Dân quyết toán\"","\"Dân phản biện\""],"e":"Theo Cẩm nang, Luật Thực hiện dân chủ ở cơ sở cụ thể hóa phương châm \"Dân biết, dân bàn, dân làm, dân kiểm tra, dân giám sát, dân thụ hưởng\" và bổ sung yếu tố \"dân thụ hưởng\" so với Pháp lệnh trước đây. Đây là cách diễn đạt chủ trương của Đảng, không phải một điều khoản cụ thể của Luật.\nVì sao các phương án còn lại chưa đúng: \"dân bầu\", \"dân quyết toán\", \"dân phản biện\" không nằm trong phương châm này.","t":"Phương châm 6 yếu tố; \"dân thụ hưởng\" là yếu tố được nhấn mạnh thêm (theo Cẩm nang).","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"C","y":"NH","r":"NĐ 61/2023/NĐ-CP · nguyên tắc","q":"Một nguyên tắc khi xây dựng hương ước, quy ước theo Nghị định 61/2023/NĐ-CP là gì?","o":["Không quy định lại những nội dung đã có trong văn bản quy phạm pháp luật","Có thể quy định hình phạt thay cho xử phạt theo pháp luật, miễn là công trình kịp hoàn thành đúng kế hoạch","Có thể hạn chế quyền tự do tín ngưỡng nếu cộng đồng đồng ý","Do Trưởng thôn soạn và ban hành, không cần lấy ý kiến và không phải giải thích thêm cho các hộ trong thôn"],"e":"Hương ước, quy ước phải phù hợp đường lối của Đảng và pháp luật; không quy định lại nội dung đã có trong văn bản quy phạm pháp luật; xuất phát từ nhu cầu tự quản, trên cơ sở tự nguyện, công khai, minh bạch; và không cản trở quyền con người, quyền công dân, tự do tín ngưỡng, tôn giáo.\nVì sao các phương án còn lại chưa đúng: hương ước không thay thế việc xử lý theo pháp luật; không được cản trở quyền cơ bản dù cộng đồng đồng ý; và phải được cộng đồng bàn, thông qua chứ không do Trưởng thôn tự ban hành.","t":"Hương ước: không lặp lại luật, không cản trở quyền công dân, do dân bàn.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-ve-xay-dung-va-thuc-hien-huong-uoc-quy-uoc-cua-cong-dong-dan-cu-119230830100225852.htm"},{"s":"C","y":"NH","r":"NĐ 61/2023/NĐ-CP; NĐ 185/2026/NĐ-CP · Điều 5 khoản 1 điểm c","q":"Ai công nhận hương ước, quy ước của thôn sau khi cộng đồng đã thông qua?","o":["Ủy ban nhân dân cấp xã","Hội đồng nhân dân cấp xã","Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã","Trưởng thôn"],"e":"Hương ước, quy ước do Ủy ban nhân dân cấp xã công nhận. (Điều 5 khoản 1 điểm c Nghị định 185 diễn đạt là \"trình Ủy ban nhân dân cấp xã phê duyệt\"; Luật và Nghị định 61 dùng từ \"công nhận\". Thẩm quyền đều thuộc cấp xã.) Quyết định công nhận cũng là mốc để văn bản bắt đầu có hiệu lực.\nTrưởng thôn có vai trò tổ chức họp, lập hồ sơ và gửi lên, chứ không tự công nhận.\nVì sao các phương án còn lại chưa đúng: HĐND và Mặt trận không công nhận hương ước, quy ước (Mặt trận cấp xã chỉ công nhận kết quả bầu thành viên các ban theo Điều 21 khoản 2); Trưởng thôn không có thẩm quyền này.","t":"Hương ước, quy ước: dân thông qua, UBND cấp xã công nhận.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-ve-xay-dung-va-thuc-hien-huong-uoc-quy-uoc-cua-cong-dong-dan-cu-119230830100225852.htm"},{"s":"C","y":"NH","r":"Luật 10/2022/QH15 · Điều 11, 14","q":"Theo Cẩm nang, ai có trách nhiệm công khai thông tin (kế hoạch phát triển kinh tế - xã hội, dự toán và quyết toán ngân sách, các khoản huy động đóng góp…) để Nhân dân biết ở cấp xã?","o":["Chủ tịch Ủy ban nhân dân cấp xã","Trưởng thôn","Trưởng Ban Công tác Mặt trận","Chủ tịch Hội đồng nhân dân cấp tỉnh"],"e":"Chủ tịch Ủy ban nhân dân cấp xã chịu trách nhiệm công khai các nội dung này; hình thức công khai gồm niêm yết tại nhà văn hóa thôn, tổ dân phố, hệ thống truyền thanh cơ sở và đăng trên cổng hoặc trang thông tin điện tử.\nTrưởng thôn phối hợp niêm yết, thông báo tại thôn, nhưng chủ thể công khai là chính quyền cấp xã.\nVì sao các phương án còn lại chưa đúng: Trưởng thôn và Trưởng Ban Công tác Mặt trận phối hợp thực hiện chứ không là chủ thể chịu trách nhiệm; cấp tỉnh không phải chủ thể ở đây.","t":"Công khai ở cấp xã: Chủ tịch UBND cấp xã chịu trách nhiệm.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 18; NĐ 59/2023/NĐ-CP · Điều 3","q":"Ai triệu tập và chủ trì cuộc họp của cộng đồng dân cư ở thôn?","o":["Trưởng thôn, Tổ trưởng tổ dân phố","Chủ tịch Ủy ban nhân dân cấp xã","Bí thư Chi bộ","Trưởng Ban Thanh tra nhân dân, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Trưởng thôn, Tổ trưởng tổ dân phố triệu tập và chủ trì cuộc họp của cộng đồng dân cư.\nVì sao các phương án còn lại chưa đúng: Chủ tịch UBND cấp xã chỉ định người triệu tập khi khuyết Trưởng thôn; Bí thư Chi bộ và Trưởng Ban Thanh tra nhân dân không có thẩm quyền triệu tập theo Luật.","t":"Người triệu tập và chủ trì họp thôn: Trưởng thôn, Tổ trưởng.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 18; NĐ 185/2026/NĐ-CP · Điều 4 khoản 2","q":"Khi thôn đang khuyết Trưởng thôn, ai tổ chức để Nhân dân họp?","o":["Người do Chủ tịch UBND cấp xã chỉ định (đại diện Mặt trận hoặc người có uy tín)","Phó thôn đương nhiên thay thế, kể cả khi chưa có quyết định của cấp xã","Bí thư Chi bộ đương nhiên làm chủ trì, theo phân công của chi bộ thôn mà không cần hỏi ý kiến thêm của người dân","Chưa được tổ chức họp, phải chờ cho đến khi bầu xong Trưởng thôn mới và không phải giải thích thêm cho các hộ trong thôn"],"e":"Khi chức danh Trưởng thôn khuyết, Chủ tịch Ủy ban nhân dân cấp xã chỉ định đại diện Ban Công tác Mặt trận hoặc một người có uy tín trong cộng đồng để triệu tập và chủ trì cuộc họp. Nhờ vậy việc bầu người thay thế vẫn tiến hành được. Song song, Điều 4 khoản 2 Nghị định 185 cho phép Ủy ban nhân dân cấp xã chỉ định Trưởng thôn lâm thời để điều hành hoạt động của thôn cho đến khi bầu được Trưởng thôn mới, tối đa 06 tháng kể từ ngày có quyết định chỉ định.\nVì sao các phương án còn lại chưa đúng: \"Phó thôn\" không phải chức danh được luật quy định để thay thế; Bí thư Chi bộ không đương nhiên chủ trì; và không cần chờ, vì chính cuộc họp là nơi bầu Trưởng thôn.","t":"Khuyết Trưởng thôn: UBND cấp xã chỉ định người triệu tập.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 18","q":"Thành phần tham dự cuộc họp của cộng đồng dân cư gồm những ai?","o":["Trưởng thôn, Ban Công tác Mặt trận và đại diện các hộ gia đình","Toàn bộ công dân từ đủ 18 tuổi trở lên, mỗi người được một phiếu biểu quyết","Trưởng thôn, Ban Công tác Mặt trận và toàn bộ đảng viên đang sinh hoạt ở thôn","Trưởng thôn cùng các chủ hộ, mỗi hộ chỉ có chủ hộ được dự họp và biểu quyết"],"e":"Thành phần gồm Trưởng thôn, Ban Công tác Mặt trận và đại diện các hộ gia đình. Đơn vị tham gia quyết định là hộ gia đình, không phải từng cá nhân.\nCách tính này lý giải vì sao ngưỡng tán thành được tính theo tổng số đại diện hộ.\nVì sao các phương án còn lại chưa đúng: không tính từng công dân; không giới hạn ở đảng viên; và pháp luật không quy định chỉ chủ hộ là nam giới.","t":"Họp thôn tính theo hộ, mỗi hộ có đại diện.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 18","q":"Đại diện của hộ gia đình khi dự họp thôn phải thỏa mãn điều kiện nào?","o":["Là người có đầy đủ năng lực hành vi dân sự","Phải là chủ hộ","Phải từ 60 tuổi trở lên","Phải có bằng tốt nghiệp trung học phổ thông"],"e":"Đại diện hộ là người có đầy đủ năng lực hành vi dân sự. Nếu trong hộ không có ai đủ điều kiện thì các thành viên trong hộ cử hoặc ủy quyền người đại diện.\nVì sao các phương án còn lại chưa đúng: pháp luật không bắt buộc phải là chủ hộ, không đặt điều kiện về tuổi 60 hay trình độ học vấn.","t":"Đại diện hộ: có đầy đủ năng lực hành vi dân sự, không bắt buộc là chủ hộ.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 18 khoản 3","q":"Thôn có từ bao nhiêu hộ trở lên hoặc dân cư sống không tập trung thì có thể họp theo từng cụm dân cư?","o":["Từ 200 hộ trở lên","Từ 100 hộ trở lên","Từ 500 hộ trở lên","Từ 1.000 hộ trở lên"],"e":"Thôn, tổ dân phố có từ 200 hộ trở lên, hoặc dân cư sống không tập trung, có thể tổ chức họp theo từng cụm dân cư.\nSau sáp nhập, thôn có thể lên tới vài trăm hộ nên quy định này rất hữu ích. Tuy vậy, việc họp theo cụm để bàn và quyết định phải theo đúng Luật và Nghị định 59; còn họp tổ liên gia để lấy ý kiến sơ bộ chỉ là bước tham khảo.\nVì sao các phương án còn lại chưa đúng: 100, 500 và 1.000 hộ không phải ngưỡng quy định.","t":"Từ 200 hộ hoặc dân cư phân tán: có thể họp theo cụm.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 18 khoản 4","q":"Hình thức biểu quyết tại cuộc họp của cộng đồng dân cư là gì?","o":["Giơ tay hoặc bỏ phiếu kín","Chỉ giơ tay","Chỉ bỏ phiếu kín","Chỉ lấy ý kiến bằng tin nhắn Zalo"],"e":"Điều 18 khoản 4: cuộc họp biểu quyết bằng hình thức giơ tay hoặc bỏ phiếu kín; hình thức do cuộc họp quyết định.\nVì sao các phương án còn lại chưa đúng: pháp luật cho phép cả hai hình thức chứ không chỉ một; nhắn tin Zalo chỉ nên dùng để thông báo, chưa thay thế biểu quyết hợp lệ tại cuộc họp.","t":"Biểu quyết họp thôn: giơ tay hoặc bỏ phiếu kín.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 21 khoản 1","q":"Nội dung nào dưới đây cần từ hai phần ba tổng số đại diện hộ gia đình tán thành mới được thông qua?","o":["Chủ trương và mức đóng góp xây dựng hạ tầng, công trình công cộng","Bầu, cho thôi làm Trưởng thôn hoặc Tổ trưởng tổ dân phố","Nội dung hương ước, quy ước của cộng đồng dân cư thôn, miễn là công trình kịp hoàn thành đúng kế hoạch","Bầu thành viên Ban Thanh tra nhân dân của cộng đồng, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Điều 21 khoản 1 chia hai nhóm ngưỡng. Hai nội dung đụng đến tiền và tài sản của người dân (khoản 1 và 2 Điều 15: chủ trương, mức đóng góp; thu, chi, quản lý các khoản đóng góp) cần từ hai phần ba tổng số đại diện hộ. Các khoản 3, 4, 5, 6 (hương ước, bầu Trưởng thôn, bầu các ban, việc tự quản khác) chỉ cần trên 50%.\nVì sao các phương án còn lại chưa đúng: ba nội dung kia thuộc nhóm chỉ cần trên 50% tổng số đại diện hộ.","t":"Tiền, tài sản của dân: ≥ 2/3. Hương ước, bầu cử: > 50%.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 21 khoản 1","q":"Bầu Trưởng thôn thông qua khi có tỷ lệ tán thành nào?","o":["Trên 50% tổng số đại diện hộ gia đình","Từ hai phần ba tổng số đại diện hộ","Trên 50% số đại diện hộ có mặt mà không cần hỏi ý kiến thêm của người dân","Từ 30% tổng số đại diện hộ và không phải giải thích thêm cho các hộ trong thôn"],"e":"Bầu, cho thôi làm Trưởng thôn (khoản 4 Điều 15) cần trên 50% tổng số đại diện hộ gia đình tán thành. Kết quả bầu có hiệu lực khi có quyết định công nhận của Ủy ban nhân dân cấp xã.\nVì sao các phương án còn lại chưa đúng: hai phần ba áp dụng cho đóng góp, thu chi; \"số có mặt\" là cách tính sai vì luật tính trên tổng số hộ; 30% không phải ngưỡng nào trong Điều 21.","t":"Bầu Trưởng thôn: > 50% tổng số đại diện hộ, rồi UBND xã công nhận.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 21 khoản 1","q":"Thôn có 400 hộ. Họp bàn mức đóng góp làm đường, có 300 đại diện hộ dự họp, 220 người giơ tay tán thành. Kết quả là gì?","o":["Chưa được thông qua, vì 220 chưa đạt hai phần ba của 400 hộ (cần ít nhất 267)","Được thông qua, vì 220 trên 300 người có mặt là hơn 73%","Được thông qua, vì 220 hộ là trên 50% của 400 hộ, miễn là công trình kịp hoàn thành đúng kế hoạch","Chưa được thông qua, vì chưa đủ 300 người dự họp, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Đóng góp xây dựng hạ tầng thuộc nhóm cần từ hai phần ba tổng số đại diện hộ. Hai phần ba của 400 là 266,7, tức cần ít nhất 267 đại diện tán thành. Con số 220 chưa đủ, dù tỷ lệ trên số người có mặt khá cao.\nNếu không đạt, thôn có thể phát phiếu lấy ý kiến đến từng hộ theo Điều 19 để thu thêm phiếu.\nVì sao các phương án còn lại chưa đúng: không tính trên số người có mặt; trên 50% chỉ áp dụng cho hương ước, bầu cử…, không áp dụng cho đóng góp; luật không đặt số người tối thiểu để khai mạc.","t":"Luôn tính trên TỔNG số hộ, không phải số người có mặt.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 19 khoản 1","q":"Trường hợp nào Trưởng thôn chuyển sang phát phiếu lấy ý kiến từng hộ?","o":["Cuộc họp không đủ đại diện hộ để đạt tỷ lệ tán thành theo quy định","Cuộc họp kết thúc sớm hơn dự kiến, còn nhiều thời gian để lấy ý kiến thêm","Có một hộ phản đối gay gắt chủ trương, làm không khí cuộc họp căng thẳng","Trưởng thôn muốn bỏ qua cuộc họp để việc triển khai được nhanh hơn"],"e":"Điều 19 khoản 1 cho phép phát phiếu khi: Chủ tịch UBND cấp xã chọn hình thức này cho nội dung cấp xã; cuộc họp không đủ đại diện hộ để đạt tỷ lệ tán thành; hoặc Trưởng thôn quyết định sau khi thống nhất với Ban Công tác Mặt trận.\nNgười dân vắng họp vẫn có thể bày tỏ ý kiến, nên quyết định có tính đại diện hơn.\nVì sao các phương án còn lại chưa đúng: kết thúc sớm hay một hộ phản đối không phải căn cứ; và Trưởng thôn không được tự ý \"bỏ họp\" mà chưa thống nhất với Ban Công tác Mặt trận.","t":"Họp không đủ tỷ lệ: chuyển sang phát phiếu từng hộ.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 19 khoản 2","q":"Khi lấy ý kiến bằng phát phiếu từng hộ, Tổ phát phiếu có bao nhiêu thành viên và phải thông báo trước bao lâu?","o":["Từ 03 đến 05 thành viên; thông báo công khai ít nhất 02 ngày trước khi phát phiếu","Từ 01 đến 02 thành viên; thông báo ít nhất 01 ngày","Từ 07 đến 09 thành viên; thông báo ít nhất 07 ngày","Chỉ Trưởng thôn, không cần thông báo trước mà không cần hỏi ý kiến thêm của người dân"],"e":"Với hình thức phát phiếu lấy ý kiến, Trưởng thôn thành lập Tổ phát phiếu lấy ý kiến từ 03 đến 05 thành viên và thông báo công khai ít nhất 02 ngày trước ngày phát phiếu; mỗi hộ gia đình được phát một phiếu (Điều 19).\nVì sao các phương án còn lại chưa đúng: các số lượng và thời hạn khác không đúng với Điều 19; Trưởng thôn không tự làm một mình và phải thông báo trước.","t":"Phát phiếu: Tổ phát phiếu 3–5 người; thông báo trước ít nhất 2 ngày; mỗi hộ 1 phiếu.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"Luật 10/2022/QH15 · Điều 20 khoản 3","q":"Quyết định của cộng đồng dân cư phải được gửi đến UBND cấp xã và Ủy ban MTTQ Việt Nam cấp xã chậm nhất bao lâu?","o":["05 ngày làm việc kể từ ngày biểu quyết","02 ngày làm việc kể từ ngày biểu quyết","10 ngày làm việc kể từ ngày biểu quyết","30 ngày kể từ ngày biểu quyết và không phải giải thích thêm cho các hộ trong thôn"],"e":"Điều 20 khoản 3: nội dung đã được cộng đồng biểu quyết thông qua phải được gửi đến Ủy ban nhân dân cấp xã và Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã trong thời hạn 05 ngày làm việc, tính từ ngày biểu quyết.\nVì sao các phương án còn lại chưa đúng: 02, 10 ngày làm việc hay 30 ngày không phải thời hạn do Luật quy định.","t":"Gửi quyết định của dân lên UBND xã và MTTQ xã trong 05 ngày làm việc kể từ ngày biểu quyết.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"D","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 6 khoản 3 điểm a","q":"Trưởng thôn có quyền gì liên quan đến công trình do Nhân dân đóng góp kinh phí xây dựng?","o":["Đại diện cộng đồng ký hợp đồng xây dựng công trình, khi đóng góp đã được hội nghị thôn thông qua","Tự ký hợp đồng xây dựng công trình và tự quyết mức đóng góp của từng hộ dân trong thôn","Ủy quyền cho Chủ tịch Ủy ban nhân dân cấp xã ký hợp đồng thay cho cộng đồng dân cư, miễn là công trình kịp hoàn thành đúng kế hoạch","Không có quyền ký hợp đồng, chỉ được chứng kiến việc ký kết của đơn vị thi công, rồi báo cáo lại sau khi mọi việc đã hoàn tất"],"e":"Điều 6 khoản 3 điểm a: Trưởng thôn, Tổ trưởng tổ dân phố đại diện cho thôn trong các quan hệ liên quan đến hoạt động của cộng đồng; là người đại diện cho cộng đồng dân cư ký hợp đồng về xây dựng công trình do Nhân dân trong thôn đóng góp kinh phí và đã được hội nghị thôn thông qua.\nĐiều kiện then chốt là việc đóng góp đã được cộng đồng thông qua đúng tỷ lệ (từ hai phần ba tổng số đại diện hộ). Chưa có biểu quyết hợp lệ thì Trưởng thôn không có cơ sở để ký.\nVì sao các phương án còn lại chưa đúng: Trưởng thôn không tự quyết mức đóng góp; không phải Chủ tịch Ủy ban nhân dân cấp xã ký thay; và Trưởng thôn có quyền ký với tư cách đại diện cộng đồng.","t":"Trưởng thôn ký hợp đồng công trình dân đóng góp, sau khi hội nghị thôn thông qua.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"D","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 6 khoản 1 điểm a, e","q":"Theo Nghị định 185/2026, Trưởng thôn có nhiệm vụ nào trong tổ chức, điều hành hoạt động của thôn?","o":["Chủ trì hội nghị thôn; tổ chức để dân bàn, quyết định; báo cáo kết quả trước hội nghị thôn","Giải quyết thủ tục hành chính của người dân thay cho Ủy ban nhân dân cấp xã khi cần thiết","Ban hành quyết định xử phạt vi phạm hành chính đối với các hộ vi phạm quy ước của thôn","Quyết định thu, chi các khoản đóng góp của dân mà không cần đưa ra hội nghị thôn bàn mà không cần hỏi ý kiến thêm của người dân"],"e":"Điều 6 khoản 1 giao Trưởng thôn: chủ trì hội nghị thôn, tổ chức hội nghị định kỳ của cộng đồng; tổ chức để cộng đồng bàn, quyết định các nội dung thuộc phạm vi Nhân dân bàn và quyết định, và để Nhân dân tham gia ý kiến; tổ chức thực hiện, theo dõi các quyết định đã thông qua, báo cáo UBND cấp xã; đại diện thôn; và báo cáo kết quả hoạt động trước hội nghị thôn theo định kỳ hằng năm hoặc khi cần thiết.\nTrưởng thôn không phải cơ quan có thẩm quyền hành chính: không giải quyết thủ tục hành chính, không xử phạt.\nVì sao các phương án còn lại chưa đúng: thủ tục hành chính và xử phạt thuộc thẩm quyền chính quyền cấp xã; thu, chi các khoản đóng góp phải do cộng đồng quyết định.","t":"Trưởng thôn: chủ trì họp, tổ chức thực hiện quyết định, báo cáo trước hội nghị thôn.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"G","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 2 khoản 2, Điều 3 khoản 2","q":"Quyền làm chủ trực tiếp của Nhân dân ở thôn, tổ dân phố thể hiện rõ nhất ở việc nào?","o":["Dân trực tiếp bàn, quyết các việc tự quản như đóng góp, quỹ, hương ước, bầu Trưởng thôn","Trưởng thôn quyết định các việc chung, người dân chỉ nghe thông báo và thực hiện và không phải giải thích thêm cho các hộ trong thôn","Ủy ban nhân dân cấp xã quyết định mọi việc của thôn, thôn chỉ có nhiệm vụ triển khai","Chỉ đảng viên mới được bàn các việc chung của thôn, còn lại thực hiện theo nghị quyết"],"e":"Điều 2 khoản 2 xác định thôn, tổ dân phố là nơi thực hiện dân chủ trực tiếp và rộng rãi, phát huy các hình thức tự quản của cộng đồng; Điều 3 khoản 2 yêu cầu bảo đảm và đề cao tính tự quản, phát huy quyền làm chủ trực tiếp của Nhân dân. Cụ thể, những việc thuộc Điều 15 Luật Thực hiện dân chủ ở cơ sở do Nhân dân trực tiếp bàn và quyết định.\nÝ nghĩa thực tế: Trưởng thôn là người tổ chức để dân bàn, tổ chức thực hiện điều dân đã quyết, chứ không quyết thay dân.\nVì sao các phương án còn lại chưa đúng: Trưởng thôn hay UBND cấp xã không được quyết thay những việc thuộc quyền quyết định của cộng đồng; và quyền bàn, quyết định thuộc đại diện các hộ, không giới hạn ở đảng viên.","t":"Việc tự quản của thôn: dân bàn, dân quyết; Trưởng thôn tổ chức và thực hiện. Tự quản: cộng đồng dân cư tự bàn, tự quyết và tự tổ chức thực hiện, tự nguyện, không trái pháp luật.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"G","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 6 khoản 2 điểm đ; Luật 10/2022/QH15","q":"Việc nào dưới đây thể hiện đúng yếu tố \"dân kiểm tra, dân giám sát\" ở thôn?","o":["Tổ chức cho dân tham gia giám sát công trình, khoản đóng góp; phối hợp Ban Giám sát đầu tư","Trưởng thôn tự nghiệm thu công trình rồi báo cáo bằng miệng trong cuộc họp thôn gần nhất","Chỉ công khai kết quả khi công trình đã hoàn thành, hồ sơ chi tiết không cho người dân xem","Giao toàn bộ việc giám sát cho cán bộ xã, người dân không cần tham gia vào việc này, miễn là công trình kịp hoàn thành đúng kế hoạch"],"e":"Điều 6 khoản 2 điểm đ giao Trưởng thôn phối hợp với Ban Thanh tra nhân dân, Ban Giám sát đầu tư của cộng đồng, Ban Công tác Mặt trận và các tổ chức, cá nhân liên quan để tổ chức cho Nhân dân tham gia giám sát các công trình, dự án, các khoản đóng góp của Nhân dân và việc thực hiện dân chủ ở cơ sở.\nGiám sát hiệu quả cần ba điều: người dân được biết thông tin, có đầu mối đại diện (các ban do dân bầu) và có quyền nêu ý kiến.\nVì sao các phương án còn lại chưa đúng: tự nghiệm thu, giấu hồ sơ hoặc loại người dân ra khỏi giám sát đều trái với tinh thần dân chủ, công khai, minh bạch.","t":"Dân giám sát: qua Ban Giám sát đầu tư, Ban Thanh tra nhân dân và quyền được xem thông tin.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"G","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 1 điểm b","q":"Việc thu, chi và quản lý các khoản đóng góp, tài trợ, ủng hộ của cộng đồng dân cư ở thôn phải bảo đảm điều gì?","o":["Công khai, minh bạch; do cộng đồng bàn và quyết định","Do Trưởng thôn giữ và chi, chỉ báo cáo khi có yêu cầu","Chỉ cần báo cáo riêng với Chủ tịch Ủy ban nhân dân cấp xã","Có thể giữ kín để tránh người dân tranh cãi"],"e":"Điều 5 khoản 1 điểm b nêu hoạt động tự quản gồm việc thu, chi, quản lý các khoản đóng góp của Nhân dân ngoài khoản pháp luật quy định, và việc quản lý, sử dụng kinh phí, tài sản do cộng đồng được giao hoặc tiếp nhận từ nguồn tài trợ, ủng hộ hợp pháp, bảo đảm công khai, minh bạch. Theo Luật Thực hiện dân chủ ở cơ sở, đây cũng là nội dung Nhân dân bàn và quyết định (Điều 15 khoản 2).\nNgười dân cần biết đã thu bao nhiêu, chi vào đâu, còn lại bao nhiêu. Công khai kịp thời là cách tốt nhất để giữ niềm tin.\nVì sao các phương án còn lại chưa đúng: giữ kín hoặc chỉ báo cáo riêng cho một bên đều không bảo đảm công khai, minh bạch với chính những người đã đóng góp.","t":"Quỹ của dân: dân bàn, dân quyết, công khai thu chi. Tự quản: cộng đồng dân cư tự bàn, tự quyết và tự tổ chức thực hiện, tự nguyện, không trái pháp luật.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"G","y":"NH","r":"Luật 10/2022/QH15 · Điều 11, 13; theo Cẩm nang","q":"Cách nào phù hợp để công khai dự toán, quyết toán công trình do dân đóng góp?","o":["Niêm yết tại nhà văn hóa, thông báo ở họp thôn, thêm loa truyền thanh hoặc Zalo thôn","Chỉ thông báo miệng cho một số hộ thân quen, những hộ còn lại tự hỏi thêm khi cần","Không chủ động công bố, chờ đến khi có người thắc mắc thì mới trả lời cho hộ đó, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Chỉ gửi báo cáo chi tiết lên Ủy ban nhân dân cấp xã, người dân không cần biết thêm"],"e":"Luật cho phép nhiều hình thức công khai: niêm yết tại nhà văn hóa thôn, tổ dân phố, truyền thanh cơ sở, đăng trên cổng hoặc trang thông tin điện tử. Với thôn, cách thiết thực là kết hợp niêm yết, thông báo tại cuộc họp và nhóm Zalo thôn để thông tin đến được nhiều hộ.\nCông khai chủ động tốt hơn công khai khi bị hỏi, vì người dân không phải đặt câu hỏi mới được biết.\nVì sao các phương án còn lại chưa đúng: nói miệng với vài hộ không phải công khai; chờ hỏi mới trả lời là thụ động; chỉ báo cáo cấp trên thì dân vẫn không được biết.","t":"Công khai chủ động, nhiều kênh: niêm yết, họp thôn, loa, Zalo.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"G","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 5 khoản 2 điểm d; NĐ 59/2023/NĐ-CP · Điều 3","q":"Thôn có nhiều người cao tuổi không dùng Zalo. Cách nào bảo đảm thông tin họp và chủ trương đến được mọi hộ?","o":["Kết hợp Zalo, loa, bảng tin; hộ không dùng điện thoại thì thông báo trực tiếp","Chỉ đăng thông báo lên nhóm Zalo của thôn vì cách này nhanh, rẻ và dễ lưu lại","Chỉ thông báo cho các hộ có điện thoại thông minh, hộ khác sẽ nghe lại từ hàng xóm","Thông báo ngay trước giờ họp ít phút để mọi người nhớ và đến dự đông đủ hơn"],"e":"Điều 5 khoản 2 điểm d giao thôn phối hợp công khai thông tin, tạo điều kiện để Nhân dân tiếp cận thông tin. Nghị định 59/2023 cho phép thông báo họp bằng giấy mời, thông báo trực tiếp đến từng hộ hoặc hình thức khác do thôn thống nhất, ít nhất 02 ngày trước khi họp.\nChuyển đổi số là công cụ hỗ trợ (Điều 3 khoản 5) nhưng không được làm ai bị bỏ lại phía sau. Người cao tuổi, hộ không có điện thoại cần được thông báo trực tiếp.\nVì sao các phương án còn lại chưa đúng: chỉ dùng Zalo hay chỉ báo cho hộ có điện thoại sẽ bỏ sót nhiều hộ; thông báo sát giờ không đáp ứng yêu cầu báo trước.","t":"Thông tin đến mọi hộ: nhiều kênh, hộ không dùng điện thoại thì báo trực tiếp.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"G","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 6 khoản 2 điểm b","q":"Người dân phản ánh đường vào xóm xuống cấp, nước sinh hoạt thiếu. Trưởng thôn nên làm gì?","o":["Ghi nhận, tổng hợp và phản ánh kịp thời lên UBND cấp xã, rồi thông tin lại kết quả cho dân","Tự tổ chức sửa chữa và giải quyết thay Ủy ban nhân dân cấp xã mà không cần báo cáo mà không cần hỏi ý kiến thêm của người dân","Chờ đến cuối năm mới tổng hợp và báo cáo một thể các vấn đề người dân đã phản ánh và không phải giải thích thêm cho các hộ trong thôn","Cho rằng việc này không thuộc nhiệm vụ của thôn nên không cần ghi nhận, chuyển tiếp"],"e":"Điều 6 khoản 2 điểm b giao Trưởng thôn nắm tình hình đời sống cộng đồng dân cư; tập hợp, phản ánh với chính quyền cấp xã các kiến nghị, nguyện vọng chính đáng của Nhân dân; báo cáo kịp thời các vấn đề phát sinh tại địa bàn. Điều 5 khoản 2 điểm b cũng nêu việc tổng hợp, phản ánh ý kiến và phối hợp giải quyết các vấn đề liên quan trực tiếp đến đời sống cộng đồng.\nVòng phản hồi quan trọng: sau khi báo cáo, cần thông tin lại cho dân biết kết quả, để người dân thấy ý kiến của mình được tiếp nhận.\nVì sao các phương án còn lại chưa đúng: Trưởng thôn không thay UBND cấp xã giải quyết việc ngoài thẩm quyền; báo cáo chậm hay bỏ qua đều trái yêu cầu \"kịp thời\".","t":"Ý kiến của dân: ghi nhận, tập hợp, báo cáo kịp thời, phản hồi lại cho dân.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"G","y":"NH","r":"Luật 10/2022/QH15 · Điều 26 khoản 1; theo Cẩm nang","q":"Giữa hai kỳ họp thôn, cách nào phù hợp để nắm bắt ý kiến của người dân?","o":["Hòm thư góp ý, nhóm Zalo thôn, qua Ban Công tác Mặt trận, hội đoàn thể; phát phiếu khi cần","Chỉ chờ người dân tự đến nhà Trưởng thôn để phản ánh khi họ có ý kiến hoặc bức xúc, miễn là công trình kịp hoàn thành đúng kế hoạch","Chỉ dựa vào báo cáo lại của cán bộ thôn, không cần hỏi trực tiếp thêm từ các hộ dân, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Chỉ dựa vào báo cáo của Ủy ban nhân dân cấp xã gửi xuống, thôn không tự thu thập thêm"],"e":"Điều 26 khoản 1 Luật liệt kê nhiều hình thức để Nhân dân tham gia ý kiến, trong đó có cuộc họp của cộng đồng, phát phiếu lấy ý kiến hộ gia đình, hòm thư góp ý, đường dây nóng, thông qua Ban Công tác Mặt trận và các tổ chức chính trị - xã hội, và mạng xã hội hoạt động hợp pháp.\nNhiều kênh giúp bắt được cả ý kiến của người ít nói, người ít có điều kiện đến họp.\nVì sao các phương án còn lại chưa đúng: chỉ chờ dân đến phản ánh hay chỉ nghe báo cáo thì chỉ thu được một phần ý kiến.","t":"Nắm ý kiến dân bằng nhiều kênh, không chỉ chờ dân tìm đến.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"G","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 6 khoản 2 điểm b; Điều 5 khoản 1 điểm d, g","q":"Làm thế nào để nắm hộ gặp khó khăn, gia đình có công trong thôn và chăm lo đúng cách?","o":["Nắm qua tổ liên gia, Mặt trận, hội đoàn thể; thăm hỏi, báo cáo xã, vận động tương trợ","Chỉ giúp khi có người chủ động đến đề nghị, còn lại thì coi như hộ đó không có khó khăn","Ưu tiên giúp các hộ gần gũi, thân quen với Trưởng thôn trước, các hộ khác tính sau","Tự quyết định ai được hỗ trợ và hỗ trợ bao nhiêu, không cần để cộng đồng biết, bàn bạc"],"e":"Điều 6 khoản 2 điểm b: Trưởng thôn nắm tình hình đời sống cộng đồng, phản ánh kiến nghị, báo cáo kịp thời các vấn đề phát sinh. Điều 5 khoản 1 điểm d và g nêu hoạt động tự quản gồm chăm lo sức khỏe cộng đồng, khuyến khích hoạt động tương trợ, giúp đỡ nhau phát triển kinh tế, giảm nghèo, nâng cao đời sống vật chất, tinh thần.\nChủ động đến với hộ khó khăn và gia đình có công, phối hợp các đoàn thể, báo cáo để cấp xã xem xét theo chính sách, đồng thời huy động tình làng nghĩa xóm.\nVì sao các phương án còn lại chưa đúng: chỉ chờ đề nghị là thụ động; thiên vị người thân hoặc tự quyết không công khai là trái nguyên tắc công bằng, minh bạch.","t":"Chăm lo hộ khó khăn, gia đình có công: chủ động nắm, phối hợp đoàn thể, báo cáo xã, vận động tương trợ.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"G","y":"NH","r":"Luật 10/2022/QH15 · Điều 15 khoản 2; NĐ 185/2026/NĐ-CP · Điều 5 khoản 1 điểm b, g","q":"Thôn vận động được một khoản ủng hộ để giúp hộ khó khăn. Việc thu, chi khoản này cần làm thế nào?","o":["Đưa ra cộng đồng bàn và quyết định nguyên tắc sử dụng, công khai danh sách và số tiền thu, chi","Trưởng thôn tự chọn người nhận, không cần thông báo mà không cần hỏi ý kiến thêm của người dân","Chi theo đề nghị riêng của từng người, không ghi chép và không phải giải thích thêm cho các hộ trong thôn","Nhập vào quỹ chung của Ban Công tác Mặt trận, không báo cáo dân"],"e":"Việc thu, chi, quản lý các khoản tài trợ, ủng hộ của cộng đồng là nội dung Nhân dân bàn và quyết định (Điều 15 khoản 2 Luật) và phải bảo đảm công khai, minh bạch (Điều 5 khoản 1 điểm b Nghị định 185). Giúp đỡ nhau là hoạt động được khuyến khích (điểm g).\nCông khai danh sách người ủng hộ và người được hỗ trợ giúp tránh nghi ngờ và để mọi người cùng góp tay.\nVì sao các phương án còn lại chưa đúng: tự chọn người nhận, không ghi chép hay không báo cáo đều làm mất tính minh bạch.","t":"Khoản ủng hộ giúp hộ khó khăn: dân bàn, ghi chép, công khai.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"G","y":"NH","r":"Luật 10/2022/QH15 · Điều 18, 19","q":"Nhiều hộ đi làm ăn xa, người già yếu không đến họp được. Cách làm nào đúng?","o":["Hộ cử hoặc ủy quyền người đại diện; họp không đủ thì phát phiếu lấy ý kiến từng hộ","Coi như các hộ vắng mặt đồng ý với mọi nội dung đã được đưa ra bàn tại cuộc họp thôn","Loại các hộ vắng mặt kéo dài ra khỏi danh sách hộ gia đình của thôn khi tính tỷ lệ","Trưởng thôn trực tiếp biểu quyết thay các hộ vắng mặt để cuộc họp đủ điều kiện"],"e":"Điều 18 cho phép hộ không có thành viên đủ điều kiện thì các thành viên chọn hoặc ủy quyền người đại diện; Điều 19 cho phép phát phiếu lấy ý kiến từng hộ khi họp không đủ đại diện để đạt tỷ lệ. Nhờ đó người đi làm xa vẫn có tiếng nói.\nNgưỡng tán thành luôn tính trên tổng số hộ, nên hộ vắng không thể được coi mặc nhiên là đồng ý.\nVì sao các phương án còn lại chưa đúng: không được coi vắng mặt là đồng ý, không được loại hộ khỏi danh sách, và Trưởng thôn không được biểu quyết thay hộ.","t":"Hộ vắng: cử đại diện hoặc dùng phiếu lấy ý kiến, không coi vắng là đồng ý.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"G","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 6 khoản 1 điểm b, e","q":"Công trình đường bê tông do dân đóng góp đã xong. Việc nào cần làm để dân thụ hưởng và yên tâm?","o":["Công khai quyết toán, báo cáo kết quả trước hội nghị thôn, để dân kiểm tra","Không cần nói thêm gì vì công trình đã hoàn thành và đưa vào sử dụng cho dân","Chỉ báo cáo bằng văn bản cho Chủ tịch Ủy ban nhân dân cấp xã là đủ theo quy định","Chờ đến khi có người dân thắc mắc rồi mới giải trình số liệu thu chi cho họ biết"],"e":"Điều 6 khoản 1 điểm b giao Trưởng thôn tổ chức thực hiện, theo dõi việc thực hiện các quyết định của cộng đồng đã được thông qua, tổng hợp và báo cáo Ủy ban nhân dân cấp xã; điểm e yêu cầu báo cáo kết quả hoạt động trước hội nghị thôn định kỳ hằng năm hoặc khi cần thiết.\nVòng \"biết, bàn, làm, kiểm tra, giám sát, thụ hưởng\" chỉ khép lại khi dân biết công trình thực hiện thế nào, chi bao nhiêu và có quyền nêu ý kiến.\nVì sao các phương án còn lại chưa đúng: không nói thêm, chỉ báo cáo cấp trên hay chờ thắc mắc đều bỏ dân ra ngoài quy trình.","t":"Làm xong phải báo cáo, công khai quyết toán trước hội nghị thôn.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"G","y":"NH","r":"Cẩm nang · mục 6.6; Luật 10/2022/QH15","q":"Tại cuộc họp, một hộ phản đối gay gắt chủ trương đóng góp. Trưởng thôn nên ứng xử thế nào?","o":["Lắng nghe, ghi ý kiến vào biên bản, giải thích bằng số liệu rồi mời cộng đồng thảo luận","Ngắt lời hộ đó để cuộc họp tiếp tục nhanh chóng theo đúng chương trình đã định sẵn, miễn là công trình kịp hoàn thành đúng kế hoạch","Coi đó là người cố tình cản trở và không cho hộ đó phát biểu thêm trong cuộc họp nữa","Chỉ ghi vào biên bản ý kiến của những người ủng hộ để quyết định được thông qua dễ hơn"],"e":"Mọi ý kiến, kể cả ý kiến phản đối, là quyền của Nhân dân theo Luật Thực hiện dân chủ ở cơ sở. Người điều hành lắng nghe, ghi nhận đầy đủ vào biên bản, giải thích bằng số liệu cụ thể rồi để cộng đồng biểu quyết. Nếu ý kiến trái chiều còn nhiều, có thể tạm hoãn để rà soát phương án.\nTôn trọng ý kiến trái chiều giúp quyết định có sức thuyết phục hơn khi thực hiện.\nVì sao các phương án còn lại chưa đúng: ngắt lời, không cho nói hoặc chỉ ghi ý kiến ủng hộ đều xâm phạm quyền phát biểu của người dân.","t":"Ý kiến trái chiều: lắng nghe, ghi biên bản, giải thích rồi mới biểu quyết.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-luat-so-10-2022-qh15-thuc-hien-dan-chu-o-co-so-119221212165541651.htm"},{"s":"G","y":"NH","r":"NĐ 185/2026/NĐ-CP · Điều 6 khoản 2 điểm c; Điều 5 khoản 2 điểm a","q":"Cộng đồng đã thông qua mức đóng góp làm đường đúng quy trình, còn vài hộ chưa đóng. Cách vận động nào phù hợp?","o":["Kiên trì đối thoại, nhờ Mặt trận, người có uy tín, tổ liên gia cùng vận động; tìm hiểu lý do","Phạt tiền các hộ chưa đóng để bảo đảm công bằng với những hộ đã thực hiện đầy đủ, rồi báo cáo lại sau khi mọi việc đã hoàn tất","Đọc tên các hộ chưa đóng trên loa truyền thanh để tạo áp lực dư luận trong cộng đồng mà không cần hỏi ý kiến thêm của người dân","Báo công an xử lý các hộ chưa đóng vì cho rằng họ không chấp hành quyết định của thôn"],"e":"Điều 6 khoản 2 điểm c giao Trưởng thôn vận động Nhân dân tham gia phát triển kinh tế - xã hội, giữ gìn an ninh trật tự, xây dựng đời sống văn hóa; Điều 5 khoản 2 điểm a nêu tuyên truyền, vận động Nhân dân là hoạt động phối hợp, hỗ trợ chính quyền cấp xã. Vận động là thuyết phục, không phải áp đặt.\nNhiều hộ chưa đóng vì hoàn cảnh khó khăn hoặc chưa hiểu rõ; tìm hiểu lý do rồi phối hợp đoàn thể hỗ trợ (ví dụ đóng bằng ngày công) hiệu quả hơn.\nVì sao các phương án còn lại chưa đúng: thôn không có thẩm quyền phạt tiền; nêu tên trên loa gây tổn thương và mất đoàn kết; việc đóng góp theo thỏa thuận cộng đồng không phải căn cứ để báo công an xử lý.","t":"Vận động là thuyết phục, không phạt, không nêu tên làm xấu hổ.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-185-2026-nd-cp-quy-dinh-ve-to-chuc-hoat-dong-cua-thon-to-dan-pho-chinh-sach-voi-nguoi-hoat-dong-khong-chuyen-trach-o-thon-to-dan-pho-119260526172229782.htm"},{"s":"E","y":"NH","r":"Cẩm nang · mục 5.1 (kinh nghiệm); NĐ 59/2023/NĐ-CP · Điều 3","q":"Về việc thông báo họp thôn, cách làm nào là phù hợp nhất?","o":["Giấy mời hoặc thông báo trước ít nhất 02 ngày, gửi thêm tài liệu tóm tắt qua Zalo thôn","Báo miệng cho các hộ ngay trước giờ họp vì tiện và nhanh, đỡ mất công in giấy mời và không phải giải thích thêm cho các hộ trong thôn","Chỉ đăng thông báo vào cuối buổi họp trước, đến kỳ họp sau không cần nhắc lại nữa, miễn là công trình kịp hoàn thành đúng kế hoạch","Chỉ gửi tài liệu qua nhóm Zalo thôn, không cần giấy mời hay thông báo trực tiếp nào"],"e":"Nghị định 59/2023 yêu cầu thông tin cuộc họp (Mẫu số 01) được thông báo đến thành phần tham dự ít nhất 02 ngày trước khi họp. Cẩm nang khuyên thêm: gửi trước tài liệu tóm tắt, dự thảo qua nhóm Zalo chính thức từ 2 đến 3 ngày để người dân nghiên cứu.\nBiết trước nội dung giúp cuộc họp ngắn gọn, ít tranh luận vòng vo.\nVì sao các phương án còn lại chưa đúng: thông báo sát giờ hoặc không có giấy mời thì không bảo đảm quyền được biết trước của hộ dân.","t":"Thông báo họp: trước ít nhất 02 ngày; gửi tài liệu sớm hơn nếu có thể.","u":"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-so-59-2023-nd-cp-quy-dinh-chi-tiet-mot-so-dieu-cua-luat-thuc-hien-dan-chu-o-co-so-119230820172027752.htm"},{"s":"E","y":"NH","r":"Cẩm nang · mục 5.1","q":"Thôn đông hộ họp tổ liên gia để lấy ý kiến sơ bộ trước. Về mặt pháp lý, các cuộc họp tổ liên gia đó có giá trị gì?","o":["Chỉ là bước tham khảo; việc bàn và quyết định phải theo Luật và Nghị định 59","Có giá trị quyết đị
